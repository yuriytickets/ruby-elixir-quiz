      ```
    starter_code: |
      class Version
        include Comparable

        def initialize(string)
          # your code here
        end

        def <=>(other)
          # your code here
        end

        def to_s
          # your code here
        end
      end
    tests: |
      require "minitest/autorun"

      class VersionTest < Minitest::Test
        def v(s) = Version.new(s)

        def test_numeric_segments
          assert v("1.2.10") > v("1.2.9")
          assert v("1.10") > v("1.9")
          assert v("0.9") < v("1.0")
        end

        def test_missing_segments_are_zero
          assert v("1.2") == v("1.2.0")
          assert_equal 0, v("2") <=> v("2.0.0")
        end

        def test_comparable_helpers
          assert v("1.5").between?(v("1.0"), v("2.0"))
          assert_equal "2.0", v("3.1").clamp(v("1.0"), v("2.0")).to_s
        end

        def test_sort_and_to_s
          sorted = [v("2.0"), v("1.10"), v("1.9")].sort.map(&:to_s)
          assert_equal ["1.9", "1.10", "2.0"], sorted
        end

        def test_incomparable_returns_nil
          assert_nil v("1.0") <=> "1.0"
        end
      end
    solution: |
      class Version
        include Comparable

        attr_reader :segments

        def initialize(string)
          @string = string
          @segments = string.split(".").map(&:to_i)
        end

        def <=>(other)
          return nil unless other.is_a?(Version)

          width = [segments.size, other.segments.size].max
          pad = ->(s) { s + [0] * (width - s.size) }
          pad.(segments) <=> pad.(other.segments)
        end

        def to_s = @string
      end
    explanation: |
      `Comparable` derives `<`, `<=`, `==`, `>`, `>=`, `between?` and `clamp` from a single `<=>`, which must
      return `-1`, `0`, `1`, or `nil` for incomparable objects (then `==` returns `false` and `<` raises
      `ArgumentError`). The trap in the task is string comparison: `"1.2.10" < "1.2.9"` is `true` lexically,
      so segments must be converted to Integers; `Array#<=>` then compares element-wise. Padding with zeros makes
      `1.2` equal `1.2.0`. Note that `Comparable#==` does not make the object a usable Hash key; that needs
      `eql?` and `hash`.
    tags: [comparable, spaceship, sorting]
    source: https://docs.ruby-lang.org/en/3.3/Comparable.html

  - slug: ruby-core-find-pattern-admin
    kind: code
    difficulty: senior
    title: "Find pattern: first admin in a list"
    body: |
      Implement `first_admin_name(users)` using a **find pattern** (`in [*, pattern, *]`) in a `case/in`.
      `users` is an array of hashes; return the `:name` of the first user whose `:role` is `"admin"`, or
      `nil` if there is none or the input is not an array. Use pattern matching rather than `find`/`detect`.

      ```ruby
      users = [{name: "ann", role: "user"}, {name: "bob", role: "admin"}, {name: "cy", role: "admin"}]
      first_admin_name(users)   # => "bob"
      first_admin_name([])      # => nil
      first_admin_name(nil)     # => nil
      ```
    starter_code: |
      def first_admin_name(users)
        case users
        # your find pattern here
        end
      end
    tests: |
      require "minitest/autorun"

      class FirstAdminTest < Minitest::Test
        def test_finds_first_admin
          users = [{name: "ann", role: "user"}, {name: "bob", role: "admin"}, {name: "cy", role: "admin"}]
          assert_equal "bob", first_admin_name(users)
        end

        def test_admin_at_edges
          assert_equal "a", first_admin_name([{name: "a", role: "admin"}])
          assert_equal "z", first_admin_name([{name: "x", role: "user"}, {name: "z", role: "admin"}])
        end

        def test_no_admin
          assert_nil first_admin_name([{name: "ann", role: "user"}])
          assert_nil first_admin_name([])
        end

        def test_not_an_array
          assert_nil first_admin_name(nil)
          assert_nil first_admin_name({name: "bob", role: "admin"})
        end

        def test_ignores_malformed_entries
          assert_equal "ok", first_admin_name([42, {role: "admin"}, {name: "ok", role: "admin"}])
        end
      end
    solution: |
      def first_admin_name(users)
        case users
        in [*, {name: String => name, role: "admin"}, *]
          name
        else
          nil
        end
      end
    explanation: |
      The find pattern `[*, pat, *]` (Ruby 3.0+) scans an array for the first element matching `pat` and binds
      variables from it, so there is no explicit loop. Hash patterns ignore extra keys and match only Hashes, so
      the Integer `42` and the admin entry without a `:name` are skipped by the pattern itself. The `else` branch
      covers `nil`, a bare Hash (an array pattern only matches objects responding to `deconstruct`) and arrays
      with no match; without it `NoMatchingPatternError` would be raised. In production code `find` is clearer;
      the interview point is knowing the pattern exists and how `deconstruct`/`deconstruct_keys` drive it.
    tags: [pattern-matching, find-pattern]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-core-object-id-immediates
    kind: theory
    difficulty: senior
    title: "object_id, immediates and why `1.object_id` is 3"
    body: |
      Every object answers `object_id`, an Integer that is unique while the object lives. The way the value is
      produced reveals how MRI represents objects.

      ```ruby
      1.object_id        # => 3
      2.object_id        # => 5
      nil.object_id      # => 8
      true.object_id     # => 20
      false.object_id    # => 0
      :a.object_id == :a.object_id        # => true
      "a".object_id == "a".object_id      # => false (new String each time)
      (2**64).object_id == (2**64).object_id  # => false (Bignum, heap allocated)
      1.0.object_id == 1.0.object_id      # => true (flonum on 64-bit)
      ```

      **Immediates**: small Integers (Fixnum range), Symbols, `nil`, `true`, `false` and, on 64-bit builds,
      most Floats (flonums) are not heap objects. The value is encoded in the `VALUE` word itself with tag bits:
      an Integer `n` is stored as `2n + 1`, hence `object_id` 3 for `1`. They are never allocated, never
      garbage collected, always frozen, and `dup` returns the receiver.

      **Heap objects** (Strings, Arrays, big Integers, your classes) get a lazily assigned, monotonically
      increasing `object_id` since Ruby 2.7 (it used to be derived from the address, which leaked
      information and broke with compaction). `ObjectSpace._id2ref` can map it back while the object is alive.

      Why it matters in interviews: it explains why `equal?` is "free" for symbols, why `"a".equal?("a")` is
      false without `frozen_string_literal`, why you cannot define singleton methods on Integers
      (`TypeError: can't define singleton`), and why Integer/Symbol keys are the cheapest Hash keys.
    answer: |
      **Q:** Why does `"a".equal?("a")` return `false` while `:a.equal?(:a)` and `1.equal?(1)` return `true`?
      **A:** Each string literal evaluates to a new heap object (unless frozen and deduplicated), so the two
      references differ. Symbols are interned once per name, and small Integers are immediates whose identity is
      the value itself, so there is nothing to allocate and every occurrence is the same object.
    explanation: |
      Senior follow-ups: "What changed with `object_id` in Ruby 2.7 and why?" (compaction / `GC.compact` needs
      objects to move, so ids can no longer be addresses). "Can you define `def 1.foo`?" (no; immediates have no
      singleton class). "Why are Integers frozen?" (immediates have no mutable state at all).
    tags: [object_id, immediates, internals]
    source: https://docs.ruby-lang.org/en/3.3/Object.html

  - slug: ruby-core-pattern-matching-lesson
    kind: theory
    difficulty: senior
    title: "Pattern matching: case/in, deconstruct and deconstruct_keys"
    body: |
      Ruby 2.7 added structural pattern matching; 3.0 made it stable and added the find pattern; 3.1 added
      one-line forms and bare `in` returning a boolean.

      ```ruby
      config = {db: {user: "app", port: 5432}, tags: ["prod", "eu"]}

      case config
      in {db: {user: String => user, port: Integer => port}, tags: [*, "prod", *]}
        puts "#{user}@#{port} in production"
      in {db: {user:}}            # key shorthand binds `user`
        puts "non-prod as #{user}"
      end

      config => {tags:}           # rightward assignment, raises NoMatchingPatternKeyError on failure
      config in {db: {port: 5432}} # => true, never raises
      ```

      Patterns: **value** (`in 1..10`, `in String`, compared with `===`), **array** (`[a, b, *rest]`, exact
      length unless splatted), **find** (`[*, x, *]`), **hash** (`{k: pat}`, extra keys allowed, `**nil` to
      forbid them), **alternative** (`in 0 | 1`), **binding** (`Integer => n`), **pin** (`^var`, `^(expr)`),
      **guard** (`in [x, y] if x < y`).

      Your own classes take part by implementing `deconstruct` (returns an Array, used by array/find patterns)
      and `deconstruct_keys(keys)` (returns a Hash; `keys` is the list the pattern asks for, or `nil` with
      `**rest`, so you can compute only what is needed). `Struct` and `Data` implement both out of the box.

      Gotchas: `case/in` **raises** `NoMatchingPatternError` without an `else`; bare identifiers always bind
      (use `^` to compare); variables bound in a failed branch may remain assigned.
    answer: |
      **Q:** Your `Point` class should match `in [x, y]` and `in {x:, y:}`. Which methods do you define, and what
      is the purpose of the `keys` argument?
      **A:** Define `deconstruct` returning `[x, y]` and `deconstruct_keys(keys)` returning `{x: x, y: y}`.
      `keys` lists the keys the pattern needs (or `nil` when the pattern uses `**rest`) so an expensive object
      can build only those entries; returning extra keys is harmless.
    explanation: |
      Follow-ups: "What is the difference between `case/when` and `case/in` on no match?" (nil vs exception),
      "How do you match a Hash with no extra keys?" (`in {a: 1, **nil}`), "How does `in` differ from `=>`?"
      (boolean test vs rightward assignment that raises).
    tags: [pattern-matching, deconstruct]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-core-implicit-return
    kind: theory
    difficulty: junior
    title: "Implicit returns and the `puts` trap"
    body: |
      A Ruby method returns the value of the **last evaluated expression**; `return` is only needed to exit early.
      Because almost everything is an expression, `if`, `case`, `begin/rescue` and even `while` produce values.

      ```ruby
      def grade(score)
        if score >= 90
          "A"
        elsif score >= 80
          "B"
        else
          "C"
        end
      end                     # returns the branch's string

      def discount(user)
        return 0 unless user  # guard clause: early exit
        user.vip? ? 20 : 5
      end

      def broken_total(items)
        total = items.sum
        puts "total: #{total}"   # puts returns nil, so this method returns nil
      end
      ```

      Things that return surprising values: `puts`/`print` return `nil`; `each` returns the receiver (so a
      method ending in `each` returns the collection, not what the block computed, use `map`); assignment
      `x = 5` evaluates to `5`; `while` returns `nil` unless broken out of with `break value`; a `def` returns a
      Symbol (`def foo; end # => :foo`), which is why `private def foo` works.

      `return a, b` returns an Array; in a block `return` exits the **enclosing method** (and raises
      `LocalJumpError` in a proc whose method has already returned), while `next` returns from the block.
    answer: |
      **Q:** What does `def total(items) = items.each { |i| @sum += i }` return, and how do you fix it to return
      the sum?
      **A:** It returns `items` because `each` returns its receiver. Return `@sum` explicitly as the last
      expression, or use `items.sum` / `items.inject(:+)`.
    explanation: |
      Interviewers follow with "what does `x = puts 'hi'` leave in `x`?" (`nil`) and "what does `return` inside a
      block passed to `each` do?" (returns from the method that contains the block, skipping the rest of the
      iteration). Common mistake: adding `return` on the last line out of habit; it is legal but unidiomatic.
    tags: [methods, return]
    source: https://docs.ruby-lang.org/en/3.3/syntax/methods_rdoc.html

  - slug: ruby-core-kernel-and-introspection
    kind: theory
    difficulty: senior
    title: "Kernel, `defined?`, `__method__` and BEGIN/END"
    body: |
      `puts`, `require`, `raise`, `loop`, `Integer()`, `format`, `rand`, `sleep` are not keywords: they are
      **private instance methods of `Kernel`**, a module included in `Object`. That is why you can call them
      anywhere without a receiver and why `obj.puts "x"` raises `NoMethodError (private method)`.
      `method(:puts).owner # => Kernel`. `BasicObject` does not include Kernel, so proxies built on it cannot
      call `puts` without `::Kernel.puts`.

      `defined?(expr)` is a keyword that returns a String describing the expression, or `nil`:

      ```ruby
      defined?(@x)         # => nil until assigned, then "instance-variable"
      defined?(String)     # => "constant"
      defined?(puts)       # => "method"
      defined?(super)      # => "super" only when a superclass method exists
      defined?(yield)      # => "yield" when a block was given (older idiom for block_given?)
      defined?(x = 1)      # => "assignment" (does not assign)
      defined?(@x && @x.zero?)  # => "expression"  <- precedence trap: always truthy
      ```

      `__method__` returns the name of the current method as a Symbol (the *defined* name, even when called
      through an alias); `nil` at top level. Useful for logging and for `send(__method__)`-style dispatch.

      `BEGIN { }` and `END { }` register blocks to run before any other code in the file and at program exit
      respectively (`END` is like `at_exit`, both run in reverse registration order). They are a `ruby -ne`
      one-liner feature, almost never seen in application code, but interviewers use them as a trivia filter.
    answer: |
      **Q:** Why does `defined?(@config && @config.loaded?)` not protect against an unset `@config`, and what
      should you write instead?
      **A:** `defined?` wraps the whole `&&` expression and reports `"expression"`, which is truthy regardless of
      `@config`. Use `defined?(@config) && @config.loaded?`, or better `instance_variable_defined?(:@config)`
      or a nil check (`@config&.loaded?`), since uninitialized ivars read as `nil` anyway.
    explanation: |
      Follow-ups: "What does `Kernel#Array(nil)` return?" (`[]`), "Where does `method_missing` live?"
      (`BasicObject`, private), "How does `at_exit` ordering work?" (LIFO). Senior candidates know that
      `Kernel` methods like `puts` are module functions: callable as `Kernel.puts` too.
    tags: [kernel, defined, introspection]
    source: https://docs.ruby-lang.org/en/3.3/syntax/miscellaneous_rdoc.html

  - slug: ruby-core-nil-conversions
    kind: theory
    difficulty: junior
    title: "Taming nil: `nil.to_a`, `Array()`, `to_s` and friends"
    body: |
      `nil` is a real object (the single instance of `NilClass`), so it responds to a handful of conversion
      methods that make defensive code shorter:

      ```ruby
      nil.to_a   # => []
      nil.to_h   # => {}
      nil.to_s   # => ""
      nil.to_i   # => 0
      nil.to_f   # => 0.0
      nil.inspect  # => "nil"
      nil & true   # => false  (NilClass#& always false)
      ```

      `Kernel#Array` is the idiomatic way to normalise "one, many or none" arguments:

      ```ruby
      Array(nil)        # => []
      Array([1, 2])     # => [1, 2]   (same array, not wrapped again)
      Array(1..3)       # => [1, 2, 3]
      Array("str")      # => ["str"]
      Array({a: 1})     # => [[:a, 1]]  <- surprise: Hash#to_a
      ```

      `Array(x)` tries `to_ary`, then `to_a`, then wraps. Because `nil.to_a` is `[]`, `Array(nil)` is empty, so
      `Array(options[:tags]).each` handles missing, single and multiple values with no `if`.
      Related idioms: `obj.to_s` instead of `obj.nil? ? "" : obj.to_s`; `value.to_i` is lenient and never raises
      (use `Integer()` when invalid input must be an error); `nil.to_sym` and `nil + 1` raise `NoMethodError`.
    answer: |
      **Q:** `params[:ids]` may be `nil`, `"3"` or `["3", "4"]`. Write one expression that always yields an
      array of Integers.
      **A:** `Array(params[:ids]).map { |id| Integer(id) }` (or `.map(&:to_i)` if lenient parsing is acceptable).
      `Array(nil)` gives `[]`, a String is wrapped, an Array is returned as is.
    explanation: |
      Follow-up: "Why is `Array({a: 1})` not `[{a: 1}]`?" (Hash implements `to_a` as pairs; wrap explicitly with
      `[hash]`). "What is the difference between `[*x]` and `Array(x)`?" (nearly the same; splat also calls
      `to_a`, so `[*{a: 1}]` is `[[:a, 1]]` too).
    tags: [nil, conversion, Kernel]
    source: https://docs.ruby-lang.org/en/3.3/NilClass.html

  - slug: ruby-core-ranges-lesson
    kind: theory
    difficulty: middle
    title: "Ranges: inclusive, exclusive, endless, and `include?` vs `cover?`"
    body: |
      A `Range` is a pair of endpoints, not a materialised list. `1..5` includes 5, `1...5` excludes it.

      ```ruby
      (1..5).to_a        # => [1, 2, 3, 4, 5]
      (1...5).size       # => 4
      ("a".."e").to_a    # => ["a", "b", "c", "d", "e"]  (uses String#succ)
      (1..10).step(3).to_a   # => [1, 4, 7, 10]  (returns an ArithmeticSequence without a block)
      (1..).first(3)     # => [1, 2, 3]   endless range (Ruby 2.6+)
      (..5).include?(3)  # => true        beginless range (Ruby 2.7+)
      arr[2..]           # slice to the end;  arr[..-2] drops the last element
      ```

      `include?` vs `cover?`: for numeric ranges both compare against the endpoints. For other types
      `include?` enumerates with `succ` and tests membership, while `cover?` only uses `<=>`:
      `("a".."z").cover?("mm")` is `true` (between the ends) but `("a".."z").include?("mm")` is `false`.
      `Range#===` uses `cover?`, which makes `when 1..10` and `when "a".."m"` cheap in `case` statements and
      also lets you write `case date when Date.new(2024,1,1)..Date.new(2024,12,31)`.

      Ranges are lazy by nature: `(1..Float::INFINITY).lazy.map { _1 * 2 }.first(3)` works, and
      `(1..).each` loops forever; `to_a` on an endless range raises `RangeError`. Ranges are frozen since
      Ruby 3.0, and a `Range` whose ends do not implement `succ` (Floats) can be covered but not iterated
      (`(1.0..2.0).each` raises `TypeError`).
    answer: |
      **Q:** Why does `("a".."z").include?("mm")` return `false` while `("a".."z") === "mm"` returns `true`?
      **A:** `include?` on a non-numeric range iterates the actual members (`"a"`, `"b"`, ..., `"z"`) and `"mm"`
      is not one of them; `===` delegates to `cover?`, which only checks `"a" <= "mm" && "mm" <= "z"` with `<=>`.
    explanation: |
      Follow-ups: "How do you build a range of Dates and iterate it?" (`Date` implements `succ`, so
      `(d1..d2).each` works), "What does `(1..10) % 3` do?" (alias for `step(3)` since 3.0), "Why prefer
      `cover?` in validations?" (it is O(1) and does not need `succ`).
    tags: [ranges, include, cover]
    source: https://docs.ruby-lang.org/en/3.3/Range.html
