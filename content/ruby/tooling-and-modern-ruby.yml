language: ruby
topic: tooling-and-modern-ruby
items:
  - slug: ruby-tool-pessimistic-version-operator
    kind: mcq
    difficulty: junior
    title: "What range does `gem \"rails\", \"~> 7.1.2\"` allow?"
    body: |
      In a Gemfile, which versions satisfy `gem "rails", "~> 7.1.2"`?
    choices:
      - ">= 7.1.2 and < 8.0"
      - ">= 7.1.2 and < 7.2"
      - "Exactly 7.1.2"
      - ">= 7.1.2 with no upper bound"
    answer: 1
    explanation: |
      The pessimistic operator `~>` means "at least this version, but only within the last digit's
      series": `~> 7.1.2` is `>= 7.1.2, < 7.2`, while `~> 7.1` is `>= 7.1, < 8.0`. Drop a segment to
      widen the range. People confuse the two forms; the number of segments you write decides the upper
      bound. `>= 7.1.2` alone would accept a breaking 8.0.
    tags: [bundler, versions]
    source: https://guides.rubygems.org/gemfile/

  - slug: ruby-tool-gemfile-vs-gemfile-lock
    kind: mcq
    difficulty: junior
    title: "Gemfile vs Gemfile.lock"
    body: |
      Which statement about `Gemfile` and `Gemfile.lock` is correct?
    choices:
      - "`Gemfile.lock` lists the version constraints you want; `Gemfile` records what was resolved"
      - "`Gemfile` declares dependencies and constraints; `Gemfile.lock` records the exact resolved versions of every gem (including transitive ones) and should be committed for applications"
      - "`Gemfile.lock` is regenerated on every `bundle exec`, so committing it is pointless"
      - "`Gemfile.lock` only lists gems from the `default` group"
    answer: 1
    explanation: |
      Bundler resolves the constraints in `Gemfile` (plus `gemspec` if present) into one consistent set of
      exact versions and writes it to `Gemfile.lock`, including transitive dependencies, the platforms, the
      Bundler version and git revisions. Committing the lock for applications guarantees every developer
      and CI install the same versions. Gems historically did not commit it (the gemspec constraints
      are the contract to consumers), though many now do for CI reproducibility. `bundle install` reads
      the lock and only re-resolves what the lock does not cover.
    tags: [bundler]
    source: https://bundler.io/man/gemfile.5.html

  - slug: ruby-tool-bundle-exec-purpose
    kind: mcq
    difficulty: junior
    title: "Why `bundle exec rspec` instead of `rspec`?"
    body: |
      What does `bundle exec` actually do?
    choices:
      - "Installs any missing gems and then runs the command"
      - "Runs the command in a context where only the gem versions from `Gemfile.lock` are activatable, so a different globally installed version of a gem cannot be loaded by accident"
      - "Runs the command with `RUBYOPT=-W0` to silence gem warnings"
      - "Compiles the command's Ruby files with YJIT before running"
    answer: 1
    explanation: |
      `bundle exec` sets up the load path (`Bundler.setup`) so `require` resolves to exactly the versions
      in the lock file and fails loudly (`Gem::LoadError`) if the lock is not satisfiable. Without it,
      RubyGems activates the newest installed version of a gem, which may differ from the lock and produce
      "you have already activated X, but your Gemfile requires Y". Binstubs (`bin/rspec`, generated by
      `bundle binstubs`) and Bundler's `BUNDLE_BIN` do the same without typing `bundle exec`. It never
      installs gems.
    tags: [bundler]
    source: https://bundler.io/man/bundle-exec.1.html

  - slug: ruby-tool-require-false-in-gemfile
    kind: mcq
    difficulty: middle
    title: "What does `require: false` do in a Gemfile?"
    body: |
      ```ruby
      gem "rubocop", require: false
      gem "whenever", require: false
      ```

      What is the effect?
    choices:
      - "The gem is installed but not added to `Gemfile.lock`"
      - "The gem is resolved and installed, but `Bundler.require` (called by Rails at boot) will not `require` it, so it does not load into the app's memory; you require it explicitly where needed"
      - "The gem is only installed in the development group"
      - "The gem's native extensions are not compiled"
    answer: 1
    explanation: |
      `Bundler.require(*groups)` requires every gem in the listed groups by its name (or the `require:`
      value, which can also be a different file name or an array). `require: false` opts a gem out of this
      autoloading. Use it for tools used from the CLI (rubocop, capistrano, whenever) or gems you require
      lazily in a specific file, which keeps boot time and memory down. It has nothing to do with
      installation, groups or the lock file.
    tags: [bundler]
    source: https://guides.rubygems.org/gemfile/

  - slug: ruby-tool-require-vs-require-relative-vs-load
    kind: mcq
    difficulty: junior
    title: "`require` vs `require_relative` vs `load`"
    body: |
      Which statement is correct?
    choices:
      - "`require` searches `$LOAD_PATH`, loads a file at most once (tracked in `$LOADED_FEATURES`) and returns `false` on repeat calls; `require_relative` resolves the path relative to the current file; `load` re-executes the file every time and needs the extension"
      - "`require_relative` searches `$LOAD_PATH` relative to the current working directory"
      - "`load` loads once and caches; `require` reloads every call"
      - "`require` needs the `.rb` extension; `load` does not"
    answer: 0
    explanation: |
      `require "foo"` walks `$LOAD_PATH` (`$:`) looking for `foo.rb` or `foo.so`, records the absolute path
      in `$LOADED_FEATURES` and returns `false` if already loaded, which is why re-requiring does not
      re-run top-level code. `require_relative "foo"` resolves relative to the directory of the file that
      contains the call, not the cwd, so it is the right tool inside a project without touching the load
      path. `load "foo.rb"` executes the file every time (useful for reloading or config files) and can
      wrap it in an anonymous module with `load(file, true)`. Gems put `lib/` on the load path, so
      their code uses plain `require "gem_name/part"`.
    tags: [require, load-path]
    source: "Ruby docs: Kernel#require, Kernel#require_relative, Kernel#load (docs.ruby-lang.org)"

  - slug: ruby-tool-pattern-matching-find-pattern
    kind: mcq
    difficulty: middle
    title: "What does this find pattern bind?"
    body: |
      ```ruby
      case [1, "a", :b, "c", "d", 2]
      in [*, String => x, String => y, *post]
        [x, y, post]
      end
      ```

      What is the result?
    choices:
      - "[\"a\", \"c\", [\"d\", 2]]"
      - "[\"c\", \"d\", [2]]"
      - "[\"a\", \"c\", [:b]]"
      - "NoMatchingPatternError"
    answer: 1
    explanation: |
      A find pattern `[*, pat..., *]` searches for the first position where the consecutive subpatterns
      all match. `"a"` is followed by `:b` (not a String), so the first match for two adjacent Strings is
      `"c", "d"`; the trailing splat captures what follows, `[2]`. The leading `*` without a name discards
      `[1, "a", :b]`. Find patterns match only arrays or objects responding to `deconstruct`; they were
      experimental in 3.0 and are stable now.
    tags: [pattern-matching]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-tool-hash-pattern-extra-keys
    kind: mcq
    difficulty: middle
    title: "Hash patterns and extra keys"
    body: |
      ```ruby
      def check(h)
        case h
        in {}            then :empty
        in {name: String} then :named
        in {name: String, **nil} then :only_name
        else :other
        end
      end

      [check({}), check({name: "A", age: 1}), check({name: "A"})]
      ```

      What is returned?
    choices:
      - "[:empty, :named, :named]"
      - "[:empty, :other, :named]"
      - "[:named, :named, :named]"
      - "[:empty, :named, :only_name]"
    answer: 0
    explanation: |
      Hash patterns match when the hash has *at least* the listed keys; extra keys are allowed, so
      `{name: "A", age: 1}` matches `{name: String}`. The single exception is the empty pattern `{}`, which
      matches only an empty hash. `**nil` forbids extra keys, but since `{name: String}` appears first,
      `{name: "A"}` already matched it, so `:only_name` is never reached. Clause order matters; put the
      stricter `**nil` clause first if you need it. Only symbol keys are supported in hash patterns.
    tags: [pattern-matching]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-tool-endless-method-definition
    kind: mcq
    difficulty: junior
    title: "Endless method definitions"
    body: |
      Which of these is valid Ruby 3.x and what does it define?
    choices:
      - "`def area = width * height` is invalid; endless methods require parentheses after the name"
      - "`def area() = width * height` and `def area = width * height` are both valid single-expression methods; `def name=(v) = @name = v` is not allowed because setters cannot be endless"
      - "`def area = width * height; end` is the correct form"
      - "Endless methods can contain multiple statements separated by newlines"
    answer: 1
    explanation: |
      Ruby 3.0 added `def name(args) = expr`. Parentheses are only mandatory when there are parameters;
      `def area = ...` without them is fine. The body is a single expression (use `;` or `then`-style
      tricks at your peril; RuboCop discourages it), there is no `end`, and assignment methods (`name=`)
      cannot be defined this way. Precedence gotcha: `def x = a and b` parses as `(def x = a) and b`.
    tags: [ruby-3, syntax]
    source: https://docs.ruby-lang.org/en/3.3/syntax/methods_rdoc.html

  - slug: ruby-tool-numbered-params-and-it
    kind: mcq
    difficulty: junior
    title: "`_1` and `it` block parameters"
    body: |
      ```ruby
      %w[a b].map { _1.upcase }
      %w[a b].map { it.upcase }
      ```

      Which statement is correct?
    choices:
      - "Both work on Ruby 2.7+; `it` is just an alias of `_1`"
      - "`_1` works since 2.7; `it` was added in Ruby 3.4 as a more readable name for the single implicit block parameter and, unlike `_1`, does not make the block arity-aware of `_2`"
      - "`it` is RSpec-only and raises `NameError` in plain Ruby"
      - "`_1` was removed in 3.4 in favour of `it`"
    answer: 1
    explanation: |
      Numbered parameters (`_1`, `_2`, ...) arrived in 2.7. Ruby 3.4 added `it` as the implicit first
      block parameter for simple blocks; it reads better and avoids the oddity that merely mentioning `_2`
      changes how `_1` destructures arrays. `_1` still works. Watch out in RSpec: `it` inside an `it`
      block body is the local block parameter under 3.4, which is only an issue if you write `it` with no
      block. Ruby 3.3 warned about `it` in blocks to prepare for this change.
    tags: [ruby-3-4, blocks]
    source: https://www.ruby-lang.org/en/news/2024/12/25/ruby-3-4-0-released/

  - slug: ruby-tool-data-define-immutability
    kind: mcq
    difficulty: middle
    title: "`Data.define` behaviour"
    body: |
      ```ruby
      Point = Data.define(:x, :y)
      p = Point.new(x: 1, y: 2)
      ```

      Which statement is correct?
    choices:
      - "`Point.new(1)` fills `y` with `nil`, like `Struct`"
      - "`p.x = 5` works because `Data` generates writers"
      - "`p` is frozen with no setters; `p.with(y: 3)` returns a new Point; `Point.new(1)` raises ArgumentError because all members are mandatory"
      - "`Point.new(1, 2)` is invalid; `Data` accepts only keyword arguments"
    answer: 2
    explanation: |
      `Data` (Ruby 3.2) is `Struct`'s immutable cousin: instances are frozen, there are no writers, both
      positional and keyword construction work, and missing members raise rather than default to `nil`.
      `with(**changes)` returns a modified copy. To add defaults or validation, override `initialize`
      with keyword args and call `super`. Equality (`==`, `eql?`, `hash`) is by value, so instances work
      as hash keys. Immutability is shallow: a member holding an array can still be mutated.
    tags: [ruby-3-2, data]
    source: https://docs.ruby-lang.org/en/3.3/Data.html

  - slug: ruby-tool-anonymous-forwarding
    kind: mcq
    difficulty: middle
    title: "Anonymous argument forwarding"
    body: |
      ```ruby
      def wrap(*, **, &)
        log(*, **, &)
      end
      ```

      On which Ruby version does this compile, and what does it do?
    choices:
      - "Ruby 2.7+; `*`, `**` and `&` are equivalent to `...`"
      - "Ruby 3.2+: anonymous `*` and `**` forwarding was added in 3.2 (anonymous `&` in 3.1); it forwards positionals, keywords and the block without naming them"
      - "Ruby 3.0+; but `&` must be named because blocks cannot be anonymous"
      - "It never compiles; a bare `*` is only allowed in method definitions, not in calls"
    answer: 1
    explanation: |
      Ruby 3.1 allowed `def m(&) = other(&)`; Ruby 3.2 extended this to `*` and `**`. `...` (2.7) forwards
      everything at once and requires parentheses at the call site, whereas the anonymous forms let you
      forward one kind while handling the others (`def m(x, *, **) = other(*, **)`). Limitations: anonymous
      parameters cannot be used inside a nested block in that method (3.3.0 had a bug here, fixed in 3.3.1
      and later), and you cannot forward a named parameter and the anonymous one together.
    tags: [ruby-3-2, arguments]
    source: https://www.ruby-lang.org/en/news/2022/12/25/ruby-3-2-0-released/

  - slug: ruby-tool-keyword-args-separation
    kind: mcq
    difficulty: middle
    title: "Keyword argument separation since Ruby 3.0"
    body: |
      ```ruby
      def greet(opts = {}, **kw) = [opts, kw]
      def create(name:, role: :user) = [name, role]

      h = { name: "A" }
      greet({ a: 1 })
      create(h)
      ```

      What happens on Ruby 3.x?
    choices:
      - "`greet` returns `[{}, {a: 1}]` and `create(h)` returns `[\"A\", :user]`"
      - "`greet` returns `[{a: 1}, {}]` and `create(h)` raises ArgumentError because a positional hash is no longer converted to keywords"
      - "Both calls raise ArgumentError"
      - "`greet` returns `[{a: 1}, {}]` and `create(h)` returns `[\"A\", :user]` because the hash is implicitly splatted"
    answer: 1
    explanation: |
      Ruby 3.0 separated positional and keyword arguments: a braced hash is positional, so `greet({a: 1})`
      fills `opts`, leaving `kw` empty; `create(h)` passes one positional argument to a method that
      accepts only keywords and raises "wrong number of arguments (given 1, expected 0; required keyword:
      name)". You must write `create(**h)`. The reverse direction still works: keywords passed to a method
      without keyword parameters are collected into a trailing positional hash. `ruby2_keywords` marks a
      method so a captured `*args` hash is flagged for delegation to keyword-accepting methods (a
      compatibility shim for 2.7-style delegation), and `**nil` in a definition rejects any keywords.
    tags: [ruby-3-0, keyword-arguments]
    source: https://docs.ruby-lang.org/en/3.3/syntax/methods_rdoc.html

  - slug: ruby-tool-gem-version-comparison
    kind: mcq
    difficulty: middle
    title: "Comparing version strings"
    body: |
      ```ruby
      "3.10" > "3.9"
      Gem::Version.new("3.10") > Gem::Version.new("3.9")
      Gem::Version.new("1.0.0.rc1") < Gem::Version.new("1.0.0")
      ```

      What are the three results?
    choices:
      - "true, true, true"
      - "false, true, true"
      - "false, true, false"
      - "true, false, true"
    answer: 1
    explanation: |
      String comparison is lexicographic, so `"3.10" > "3.9"` is false (`"1" < "9"`). `Gem::Version` splits
      on dots and compares segments numerically, so 3.10 > 3.9. Any segment containing letters marks a
      prerelease, and prereleases sort *before* the release they precede (`1.0.0.rc1 < 1.0.0`), with
      alphabetic parts compared as strings (`a10 > a9` thanks to splitting letters and digits). Use
      `Gem::Version` (stdlib, always available) for any version logic, and `Gem::Requirement.new("~> 2.1")
      .satisfied_by?(v)` for constraints.
    tags: [rubygems, versions]
    source: https://docs.ruby-lang.org/en/3.3/Gem/Version.html

  - slug: ruby-tool-bundle-update-vs-install
    kind: mcq
    difficulty: middle
    title: "`bundle install` vs `bundle update`"
    body: |
      A teammate ran `bundle update` to add one gem and the PR diff shows 60 changed lines in
      `Gemfile.lock`. What happened and what should they have run?
    choices:
      - "`bundle install` was needed; `bundle update` without arguments re-resolves every gem to the newest version allowed by the Gemfile, rewriting the whole lock, whereas `bundle install` keeps locked versions and only resolves new/changed gems"
      - "`bundle update` is correct; the lock file always changes that much when adding a gem"
      - "They should have run `bundle outdated`, which installs the newest versions and updates the lock"
      - "`bundle install --conservative` is the only way to add a gem without touching other versions"
    answer: 0
    explanation: |
      `bundle install` honours `Gemfile.lock` and only resolves what the lock does not cover (a newly
      added gem and its deps). `bundle update` discards locked versions for all gems (or the named ones:
      `bundle update rails --conservative` to avoid bumping shared deps) and re-resolves to the newest
      allowed versions. `bundle outdated` only reports which locked gems have newer versions; it changes
      nothing. The habit to teach: add the gem to the Gemfile, run `bundle install`, and run
      `bundle update <gem>` deliberately when you want to upgrade.
    tags: [bundler]
    source: https://bundler.io/man/gemfile.5.html

  - slug: ruby-tool-regexp-timeout
    kind: mcq
    difficulty: senior
    title: "Protecting against ReDoS with `Regexp` timeouts"
    body: |
      ```ruby
      Regexp.timeout = 1.0
      re = Regexp.new('(a+)+$', timeout: 0.1)
      re.match?("a" * 40 + "!")
      ```

      Which statement is correct for Ruby 3.2+?
    choices:
      - "The per-regexp `timeout:` is ignored when a global timeout is set, so this match is aborted after 1.0 s"
      - "The per-regexp timeout (0.1 s) takes precedence over the global `Regexp.timeout`; if the match exceeds it a `Regexp::TimeoutError` is raised; additionally 3.2's memoized matching makes most patterns linear so many classic ReDoS patterns no longer blow up at all"
      - "Timeouts only apply to `Regexp.new`, not to regexp literals, so most code is unprotected"
      - "`Regexp.timeout=` can be called from any Ractor and applies only to that Ractor"
    answer: 1
    explanation: |
      Ruby 3.2 added two defences: a memoization-based matching algorithm that runs most regexps in
      linear time (defeating the typical `(a+)+` backtracking explosion), and timeouts for the patterns
      the optimisation cannot cover (back-references, some look-arounds). `Regexp.timeout=` sets a
      process-wide default (main Ractor only); `Regexp.new(src, timeout:)` overrides it per object and
      wins. When exceeded, `Regexp::TimeoutError` is raised. Literals use the global default. Setting a
      global timeout in web apps is a cheap safety net against user-supplied input in regexps.
    tags: [ruby-3-2, regexp, security]
    source: https://docs.ruby-lang.org/en/3.3/Regexp.html

  - slug: ruby-tool-load-path-autoload-zeitwerk
    kind: open
    difficulty: middle
    title: "`$LOAD_PATH`, `autoload` and how Rails finds your classes"
    body: |
      Explain how Ruby locates a file for `require "foo/bar"`, what `autoload` does, and how Rails'
      Zeitwerk differs from both. What breaks if you put code in `lib/` without configuring anything?
    answer: |
      - `require "foo/bar"` iterates `$LOAD_PATH` (`$:`) looking for `foo/bar.rb` (or `.so`/`.bundle`); the
        first hit wins and is recorded in `$LOADED_FEATURES`. RubyGems adds each activated gem's
        `require_paths` (usually `lib/`) to `$LOAD_PATH`; `ruby -I lib` and `RUBYLIB` add more.
      - `Module#autoload(:Const, "path")` registers a constant so that the *first reference* to `Foo::Const`
        triggers `require "path"`. It is lazy loading per constant, used by stdlib and gems to cut boot
        time; the path still goes through `$LOAD_PATH`.
      - Zeitwerk (Rails 6+) walks the autoload paths (`app/*`, plus `config.autoload_lib(ignore: ...)` for
        `lib/` in Rails 7.1) and defines `autoload`s for every file, relying on a strict naming convention:
        `app/models/user_profile.rb` must define `UserProfile`, `app/services/billing/invoice.rb` must define
        `Billing::Invoice`. It also supports reloading in development and `eager_load` in production.
      - `lib/` is not autoloaded by default (before 7.1) and is not on `$LOAD_PATH` in a Rails app, so
        `require "my_lib"` fails with `LoadError` and `MyLib` fails with `NameError` until you add
        `config.autoload_lib` / `config.autoload_paths` or `require` it explicitly from an initializer.
      - Debugging tools: `bin/rails zeitwerk:check`, `$LOADED_FEATURES.grep(/foo/)`,
        `Gem::Specification.find_by_name("x").full_require_paths`.
    explanation: |
      Follow-up: "Why does `require_relative` not depend on `$LOAD_PATH`?" (it resolves from the calling
      file's directory). Also: "What is the difference between `autoload` and Zeitwerk's `eager_load!`?"
      (lazy vs load everything at boot so missing constants fail early and forked workers share memory).
    tags: [load-path, autoload, zeitwerk]
    source: "Ruby docs: Module#autoload and Kernel#require; Rails Guides: Autoloading and Reloading Constants"

  - slug: ruby-tool-rake-tasks
    kind: open
    difficulty: middle
    title: "Writing Rake tasks: namespaces, dependencies, arguments"
    body: |
      Write (in words or code) a Rake task `reports:monthly` that depends on `:environment`, takes a
      `year` and `month` argument, has a description, and explain how task dependencies and the default
      task work.
    answer: |
      ```ruby
      namespace :reports do
        desc "Generate the monthly report (rake 'reports:monthly[2024,5]')"
        task :monthly, [:year, :month] => :environment do |t, args|
          args.with_defaults(month: Date.today.month)
          MonthlyReport.new(args[:year].to_i, args[:month].to_i).generate
        end
      end

      task default: %w[spec rubocop]
      ```
      - `task name => [:deps]` runs prerequisites first, each at most once per Rake process; `:environment`
        (defined by Rails) loads the app, without it models are unavailable.
      - Arguments go in brackets at the call site (`rake "reports:monthly[2024,5]"`, quoted in zsh);
        they arrive as strings in `args` (a `Rake::TaskArguments`). Environment variables
        (`YEAR=2024 rake ...`) are the older alternative.
      - `desc` makes the task show up in `rake -T`; tasks without a description are hidden.
      - `task default:` is what plain `rake` runs; `Rakefile` at the project root is loaded first, and
        `lib/tasks/*.rake` are loaded by Rails.
      - `Rake::Task["reports:monthly"].invoke(2024, 5)` runs it programmatically (once; use `.reenable`
        or `.execute` to run again); `rake -P` prints prerequisites.
    explanation: |
      Follow-ups: "What are the `rake db:` conventions?" (`db:create`, `db:migrate`, `db:rollback`,
      `db:seed`, `db:prepare` which creates+migrates+seeds as needed, `db:schema:load` for fresh setups,
      `db:migrate:status`) and "Why is `:environment` slow and how do you avoid it for pure tasks?"
      (it boots Rails; omit it for tasks that do not need the app).
    tags: [rake]
    source: "Rake README and Rakefile format documentation (ruby.github.io/rake)"

  - slug: ruby-tool-rubocop-in-a-team
    kind: open
    difficulty: middle
    title: "Introducing RuboCop into a legacy codebase"
    body: |
      You join a team with a large Rails app and no linter. How would you introduce RuboCop without
      stopping feature work, and which configuration knobs matter?
    answer: |
      - Add `gem "rubocop", require: false` (plus `rubocop-rails`, `rubocop-rspec`, `rubocop-performance`)
        and a `.rubocop.yml` with `require:`/`plugins:` for the extensions, `AllCops: TargetRubyVersion`
        (so cops match your Ruby), `NewCops: enable`, and `Exclude:` for generated files
        (`db/schema.rb`, `bin/*`, `node_modules`).
      - Run `rubocop --auto-gen-config` to produce `.rubocop_todo.yml`, which disables or raises limits for
        every currently failing cop; `.rubocop.yml` does `inherit_from: .rubocop_todo.yml`. CI is green on
        day one and the todo file is burned down over time.
      - Fix safely: `rubocop -a` applies only "safe" autocorrections; `-A` includes unsafe ones that can
        change semantics (e.g. `Style/StringConcatenation`), so review those diffs.
      - Decide style questions once (quotes, frozen string literal comments, line length) and prefer the
        community defaults; opt out of contested cops (`Metrics/*`, `Style/Documentation`) rather than
        fighting them in every PR.
      - Wire it in: editor via `ruby-lsp`/the built-in LSP server, pre-commit hook or `lefthook`, and a CI
        job running `rubocop --parallel`; optionally only on changed files for speed.
    explanation: |
      Follow-up: "What is the difference between `Enabled: false` in `.rubocop.yml` and in the todo file?"
      (intent: permanent policy vs temporary debt). And "Why is `-A` risky?" (unsafe cops can alter
      behaviour, e.g. changing `==` nil checks or `Hash#each` to `each_pair` on objects that are not
      hashes).
    tags: [rubocop, style]
    source: https://github.com/bbatsov/rubocop

  - slug: ruby-tool-version-managers
    kind: open
    difficulty: middle
    title: "Version managers and `.ruby-version`"
    body: |
      Compare rbenv, rvm and asdf/mise. What does `.ruby-version` do, how does it interact with Bundler,
      and what goes wrong in CI or Docker if the pinned version is missing?
    answer: |
      - rbenv: shims on `PATH` (`~/.rbenv/shims/ruby`) that pick the version from `RBENV_VERSION`,
        `.ruby-version` (walking up from cwd) or the global setting; no shell overrides, builds via
        `ruby-build`. rvm: overrides `cd` and replaces `gem`/`ruby` with shell functions, supports gemsets
        (mostly obsolete since Bundler). asdf/mise: one tool for many languages, `.tool-versions`
        (`ruby 3.3.2`), plugins per language; mise also reads `.ruby-version`.
      - `.ruby-version` is a convention file; all managers read it, Bundler also reads it if the Gemfile
        says `ruby file: ".ruby-version"` (Bundler 2.4+) so the Gemfile and the manager cannot drift. A
        `ruby "3.3.2"` line in the Gemfile makes `bundle install` fail on any other version.
      - CI: use `ruby/setup-ruby` with `ruby-version: .ruby-version`; Docker: `FROM ruby:3.3.2`, no
        version manager inside the image. Missing version means shims fail with "version X is not
        installed" or Bundler aborts with "Your Ruby version is 3.2.0, but your Gemfile specified 3.3.2".
      - Patch versions matter: `3.3` vs `3.3.2` in `.ruby-version` behaves differently per manager
        (rbenv requires exact unless configured; mise accepts prefixes).
    explanation: |
      Follow-up: "Why do people say gemsets are unnecessary?" (`Gemfile.lock` + `bundle exec` already
      isolate per project). And "What is `RUBYOPT`?" (env var of extra interpreter flags, e.g.
      `RUBYOPT=--yjit` or `-W:no-deprecated`, read by every `ruby` invocation including shims).
    tags: [rbenv, asdf, versions]
    source: "rbenv README (github.com/rbenv/rbenv) and asdf docs (asdf-vm.com)"

  - slug: ruby-tool-debugging-irb-pry-debug
    kind: open
    difficulty: middle
    title: "Debugging: `binding.irb`, `binding.break`, pry, rdbg"
    body: |
      Compare `binding.irb`, the `debug` gem (`binding.break` / `debugger`, `rdbg`) and pry. What can
      each do, and how do you debug a process you cannot add breakpoints to (e.g. a Puma worker)?
    answer: |
      - `binding.irb` (stdlib since 2.4): opens an IRB session at that point with access to local
        variables; you can inspect and run code, but there is no stepping; `exit` continues. IRB in 3.3+
        gained `show_source`, `ls`, `help` and (with the debug gem installed) `debug`/`next`/`step`
        commands that hand over to rdbg.
      - `debug` gem (bundled since 3.1): `require "debug"` then `binding.break` (`binding.b`, `debugger`)
        opens a real debugger: `step`/`next`/`continue`, `break File:line`, conditional breakpoints,
        `catch Exception`, `watch @ivar`, `bt`, `info`, `do: "cmd"`/`pre: "cmd"` options to script a
        breakpoint. `rdbg script.rb` runs under the debugger without code changes; `rdbg -c rails s`
        wraps a command.
      - Remote: start the app with `rdbg --open` (or `RUBY_DEBUG_OPEN=1`) and attach with `rdbg -A`;
        VS Code / `ruby-lsp` use the same DAP protocol, so you can debug a Puma worker or a job runner
        you cannot drop a breakpoint into. Sending `SIGINT` to an `rdbg` session also suspends it.
      - pry: a REPL replacement with `binding.pry`, `ls`, `cd`, `show-method`, `whereami`; stepping needs
        `pry-byebug`. Still popular, but much of its value is now in IRB + debug.
      - Lower-tech tools: `p`/`pp`, `Kernel#caller`, `warn obj.inspect`, `ruby -rtracer`,
        `TracePoint`, and `ObjectSpace` (`count_objects`, `each_object(Class)`) for memory questions.
    explanation: |
      Follow-up: "Why does `binding.irb` in a Puma multi-threaded server behave badly?" (other threads
      keep running and writing to the same TTY; use `rdbg --open` or run with a single thread). Also
      "How do you break on every exception?" (`catch StandardError` in rdbg).
    tags: [debugging, irb, debug]
    source: https://github.com/ruby/debug

  - slug: ruby-tool-yjit-enable-and-when-it-helps
    kind: open
    difficulty: senior
    title: "YJIT: enabling it and knowing when it helps"
    body: |
      How do you enable YJIT in Ruby 3.3/3.4, how do you verify it is on, and for which workloads
      does it help or not? What are the memory considerations?
    answer: |
      - Enable: `ruby --yjit`, `RUBYOPT=--yjit` (picked up by every process incl. Puma, Sidekiq, rake), or
        at runtime `RubyVM::YJIT.enable` (3.3+; Rails 7.2 calls it automatically in production when
        available). Check with `RubyVM::YJIT.enabled?` and stats via `RubyVM::YJIT.runtime_stats`
        (`--yjit-stats` for full counters); 3.4 adds `--yjit-log`.
      - Requires a Ruby built with Rust support (official Docker images and most package managers have
        it). Verify `ruby -v` shows `+YJIT` when enabled.
      - What it does: lazy basic-block versioning JIT compiling hot methods to machine code,
        specialising on observed types; 3.3 made it much faster and lower-memory, 3.4 inlines small
        methods. Typical Rails apps see 15-30% lower request latency; CPU-bound Ruby code (serialisation,
        templating, parsing) benefits most.
      - Where it does not help: I/O- or DB-bound work, code paths run once (compilation cost never
        recouped), and C extensions (already native). Startup time is slightly worse.
      - Memory: compiled code lives in an executable memory region bounded by `--yjit-exec-mem-size`
        (3.3) / `--yjit-mem-size` (3.4, default 128 MiB); each process uses that budget, so forked
        Puma/Unicorn workers multiply it. Code GC (`--yjit-code-gc`) reclaims cold code. Metadata
        overhead is tracked in `runtime_stats[:yjit_alloc_size]`.
      - `--yjit-call-threshold` controls when a method is compiled (default 30; raised automatically for
        large apps so boot code is not compiled).
    explanation: |
      Follow-up: "What is RJIT?" (pure-Ruby experimental JIT in 3.3 replacing MJIT; not for production).
      "What is the GVL's role?" (YJIT speeds up single-thread execution; it does not add parallelism,
      which is Ractors' job).
    tags: [yjit, performance]
    source: https://www.ruby-lang.org/en/news/2023/12/25/ruby-3-3-0-released/

  - slug: ruby-tool-rbs-steep-vs-sorbet
    kind: open
    difficulty: senior
    title: "Gradual typing: RBS + Steep vs Sorbet"
    body: |
      Compare RBS/Steep with Sorbet. How does each express a signature, what do they check, and how would
      you pick one for a 200k-line Rails app?
    answer: |
      - RBS (official, Ruby 3.0+): type signatures in separate `.rbs` files (`sig/`), e.g.
        `def find: (Integer id) -> User?`; the Ruby source stays untouched. `rbs` ships with Ruby;
        `rbs collection` fetches gem signatures from `gem_rbs_collection`; `rbs prototype rb` /
        `typeprof` generate drafts. Steep is the type checker that reads RBS and reports errors;
        `ruby-lsp` and Steep's LSP show them in the editor. No runtime checking.
      - Sorbet (Stripe): inline signatures `sig { params(id: Integer).returns(T.nilable(User)) }` above
        the method, `T.let`, `T.must`, `T::Struct`, strictness levels per file (`# typed: false/true/strict`),
        a very fast C++ checker (`srb tc`) with LSP, and `sorbet-runtime` checking types at runtime (with
        a performance cost you can disable). Tapioca generates RBI files for gems and Rails DSLs.
      - Trade-offs: RBS keeps code clean and is "the" standard, but the ecosystem of signatures is thinner
        and Steep is slower on big codebases; Sorbet is mature on huge Rails apps (Stripe, Shopify),
        has excellent Rails support via Tapioca, but adds `sig` noise, a runtime dependency and an RBI
        tree to maintain; the two formats can be converted (`sorbet-rbs` / `rbs` from RBI) imperfectly.
      - For 200k lines: adopt incrementally per file, start with the hottest domain code and public
        service boundaries, generate gem signatures, and gate CI on "no new errors". Sorbet is usually the
        pragmatic pick for large Rails apps today; RBS/Steep for gems and libraries wanting the official
        standard. Either way typing pays off mainly in editor feedback, refactoring safety and documenting
        nilability.
    explanation: |
      Follow-up: "What does `T.let` do at runtime?" (asserts and returns the value, raising
      `TypeError` if `sorbet-runtime` checks are on). "How do you type a method that takes a block in
      RBS?" (`{ (Integer) -> void } -> void`).
    tags: [rbs, sorbet, steep, typing]
    source: "RBS README (github.com/ruby/rbs), Steep README (github.com/soutaro/steep) and sorbet.org docs"

  - slug: ruby-tool-ractor-and-fiber-scheduler
    kind: open
    difficulty: senior
    title: "`Ractor` and `Fiber::Scheduler`: what problem does each solve?"
    body: |
      Explain what Ractors and the Fiber scheduler interface are for, how they differ from Threads under
      the GVL, and why neither is widely used in Rails apps yet.
    answer: |
      - Threads: preemptive, share all memory, but the GVL lets only one thread run Ruby code at a time;
        they give concurrency for I/O (the GVL is released on blocking calls) but not CPU parallelism.
      - Ractor (3.0, experimental): actor-like isolated interpreters inside one process, each with its own
        GVL, so Ruby code runs truly in parallel. Isolation is enforced: Ractors cannot share mutable
        objects; you `send`/`receive` messages (copied, or moved with `move: true`), and only shareable
        objects (frozen, immutable, `Ractor.make_shareable`) cross the boundary. Non-main Ractors cannot
        touch many globals/class variables, and most gems (and Rails) are not Ractor-safe, so adoption is
        limited to CPU-bound pure-Ruby computations. 3.4 added `Ractor.main?`, `Ractor.[]` local storage.
      - `Fiber::Scheduler` (3.0+): a hook interface, not an implementation. When a scheduler is set
        (`Fiber.set_scheduler`), blocking operations (`IO#read`, `sleep`, `Queue#pop`, DNS, `Process.wait`)
        call into it instead of blocking the thread, so fibers can be multiplexed as lightweight
        non-blocking tasks, Node-style, without changing application code. Implementations: the `async`
        gem, Falcon web server; Rails 7.1+ has `config.active_support.isolation_level = :fiber` so
        request state is per fiber.
      - Difference: Ractors give parallelism with isolation (good for CPU); fiber scheduling gives
        massive I/O concurrency on one thread (good for many slow HTTP calls); both still under the same
        process memory. Thread-based Puma remains the default because database drivers, gems and
        thread-local assumptions (e.g. `Thread.current[]`) are not fiber- or Ractor-aware everywhere.
    explanation: |
      Follow-up: "What is M:N threading in 3.3?" (`RUBY_MN_THREADS=1`: M Ruby threads on N native threads,
      cheaper thread creation; off by default on the main Ractor). "Can you share a `Hash` between
      Ractors?" (only if deeply frozen via `Ractor.make_shareable`).
    tags: [ractor, fiber, concurrency]
    source: https://www.ruby-lang.org/en/news/2024/12/25/ruby-3-4-0-released/

  - slug: ruby-tool-deconstruct-keys-design
    kind: open
    difficulty: middle
    title: "Making your own objects pattern-matchable"
    body: |
      How do you make a custom class work with `case/in` hash patterns and array patterns? What is the
      `keys` argument to `deconstruct_keys` for, and when is rightward assignment (`=>`) preferable to
      `case/in`?
    answer: |
      - Implement `deconstruct` (returns an Array) for array/find patterns and `deconstruct_keys(keys)`
        (returns a Hash with symbol keys) for hash patterns. `Struct` and `Data` implement both already;
        `Time`/`Date` got `deconstruct_keys` in 3.2 (`in {year:, month:}`); `MatchData` too.
      - `keys` is the list of keys the pattern asks for (or `nil` when the pattern has `**rest`), so an
        object can compute only the requested, possibly expensive, values:
        ```ruby
        def deconstruct_keys(keys)
          h = { id: id, name: name }
          h[:orders] = load_orders if keys.nil? || keys.include?(:orders)
          h
        end
        ```
      - A class check can be combined with the pattern: `in User(name:, role: :admin)` or
        `in User[name, _]`, which calls `User === obj` then deconstructs.
      - `=>` (rightward pattern) is for *destructuring* when you already know the shape; it raises
        `NoMatchingPatternKeyError`/`NoMatchingPatternError` on mismatch: `config => {db: {host:, port:}}`.
        `case/in` is for *branching*; `obj in pattern` returns a boolean for guards and `select` calls.
      - Pin (`^var`, `^(expr)`) matches against an existing value instead of binding; guards (`in x if
        x > 0`) add conditions; alternatives use `|` but cannot bind variables.
    explanation: |
      Follow-up: "Why does `in {name: name}` sometimes shadow a local?" (patterns *bind*, they do not
      compare; use `^name` to compare with the existing variable). Also: `deconstruct_keys` should be
      cheap and side-effect free since it may be called for every `in` clause tried.
    tags: [pattern-matching, deconstruct]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-tool-prism-parser-and-ast
    kind: open
    difficulty: senior
    title: "Prism and the parser ecosystem"
    body: |
      What is Prism, why did Ruby replace `parse.y`, and what does it mean for tools like RuboCop,
      `ruby-lsp` and anyone using `RubyVM::AbstractSyntaxTree` or the `parser` gem?
    answer: |
      - Prism (3.3 as a default gem, default parser in 3.4) is a hand-written, error-tolerant, portable
        Ruby parser with a C core and bindings for Ruby, JRuby, TruffleRuby and others. `parse.y` was a
        Bison-generated grammar tightly coupled to CRuby, hard to maintain, not reusable and not
        tolerant of syntax errors (useless for editors on half-typed code).
      - Error tolerance means an LSP can give completions in a file with a missing `end`; one shared
        parser means every tool agrees on syntax; `--parser=parse.y` (3.4) switches back if a regression
        appears; 3.3 generated its own parser with Lrama instead of Bison as an intermediate step.
      - Tooling: `Prism.parse(src)` returns a result with the node tree, comments, magic comments and
        errors; `Prism::Visitor` for traversal. RuboCop 1.62+ can run on Prism via `prism` translation
        of the `parser` gem AST, `ruby-lsp` uses Prism directly, Syntax Tree/`rubocop-ast` are migrating.
      - `RubyVM::AbstractSyntaxTree.of(method_or_proc)` / `.parse(src)` exposes CRuby's internal AST,
        CRuby-only and unstable across versions; it is still useful for tricks like reading a block's
        source (`keep_script_lines: true`), but new code should use Prism.
      - Related CLI: `ruby -c file.rb` checks syntax ("Syntax OK") without running, `ruby --dump=parsetree`
        / `--dump=prism_parsetree` prints the tree.
    explanation: |
      Follow-up: "What is the `parser` gem then?" (whitequark's pure-Ruby parser used by RuboCop for a
      decade; maintenance burden per Ruby version is what Prism removes). Also "Why does the LSP
      matter?" (`ruby-lsp` by Shopify provides diagnostics, go-to-definition, formatting and debugging in
      editors; it relies on Prism and optionally RuboCop and Sorbet/RBS add-ons).
    tags: [prism, parser, ruby-lsp]
    source: https://www.ruby-lang.org/en/news/2023/12/25/ruby-3-3-0-released/

  - slug: ruby-tool-gem-authoring-semver
    kind: open
    difficulty: middle
    title: "Publishing a gem: semantic versioning and dependency declarations"
    body: |
      You are extracting an internal library into a gem. Explain how you version it, how you declare
      dependencies in the gemspec, and what `bundle gem` scaffolds for you.
    answer: |
      - SemVer `MAJOR.MINOR.PATCH`: PATCH for backwards-compatible fixes, MINOR for compatible features,
        MAJOR for breaking changes. Consumers then pin `~> 1.2` (any 1.x >= 1.2) and are safe as long as
        you honour it. Below 1.0 everything may break, so `~> 0.3.1` is the cautious pin. Keep a
        CHANGELOG and tag releases (`rake release` pushes the tag and the gem).
      - `spec.add_dependency "faraday", "~> 2.0"` (runtime; shipped to every consumer, so keep
        constraints as loose as you can test: `>= 1.0, < 3`) vs
        `spec.add_development_dependency "rspec"` (only for working on the gem; many projects now put
        dev deps in the Gemfile instead and keep `gemspec` for runtime ones).
      - `spec.required_ruby_version = ">= 3.1"`, `spec.files` via `git ls-files` or an explicit list
        (do not ship specs), `spec.metadata["rubygems_mfa_required"] = "true"`.
      - Gemfile for the gem repo contains `gemspec`, which pulls runtime deps into `default` and dev deps
        into `development`; consumers can test an unreleased version with `gem "foo", github: "org/foo",
        branch: "main"` (resolved by git SHA in the lock) or `path: "../foo"`.
      - `bundle gem foo` scaffolds `foo.gemspec`, `lib/foo.rb` + `lib/foo/version.rb`, `Rakefile` with
        `bundler/gem_tasks` (`rake build/install/release`), `bin/console`, test framework, CI, rubocop and
        license files; `--mit --test=rspec --ci=github` choose options.
      - Structure: everything under `lib/foo/`, only `lib/foo.rb` at top level, which requires the rest;
        `exe/` for executables (`spec.bindir = "exe"`).
    explanation: |
      Follow-up: "A consumer complains `bundle update` broke them on your 1.3 release; what happened?"
      (you shipped a breaking change as MINOR, or changed a dependency constraint). "How do you test
      against multiple Ruby/Rails versions?" (Appraisal or a matrix in CI with separate Gemfiles).
    tags: [gems, semver, gemspec]
    source: https://guides.rubygems.org/gemfile/

  - slug: ruby-tool-warnings-deprecated-frozen-string-literal
    kind: open
    difficulty: middle
    title: "Deprecation warnings and the frozen string literal roadmap"
    body: |
      Why are deprecation warnings off by default in Ruby 2.7.2+ and how do you turn them on in CI?
      What is the plan for frozen string literals, and what are "chilled" strings in 3.4?
    answer: |
      - Since 2.7.2, `Warning[:deprecated]` is `false` by default because the 2.7 keyword-argument
        warnings were too noisy. Enable with `ruby -W:deprecated`, `-w` (which also sets `$VERBOSE = true`
        and other categories), `RUBYOPT=-W:deprecated`, or `Warning[:deprecated] = true` in code;
        `-W:no-deprecated` silences them. Categories: `:deprecated`, `:experimental`, `:performance`
        (3.3+). In CI set `RUBYOPT="-W:deprecated"` so upgrades surface what will break.
      - `Warning.warn` can be overridden (or use `Warning.categories` and the `warning` gem) to turn
        selected warnings into errors or to filter third-party noise.
      - Frozen string literals: since 2.3 the magic comment `# frozen_string_literal: true` freezes
        literals in that file (fewer allocations, no accidental mutation). Making this the default for
        all files has been discussed for years; Ruby 3.4 took the middle step with "chilled" strings:
        literals in files without the comment are not frozen, but mutating one emits a deprecation
        warning (visible with `-W:deprecated`), so you can find code that relies on mutable literals.
        A later version is expected to freeze by default. `--enable-frozen-string-literal` and
        `--disable-frozen-string-literal` flip the behaviour globally for testing.
      - Fix pattern: use `+""`, `String.new`, or `dup` where you need a mutable buffer; `<<` on a literal
        is the usual offender.
    explanation: |
      Follow-up: "Does `# frozen_string_literal: true` freeze interpolated strings?" (no; `"a#{b}"` is a
      new, unfrozen string since 3.0). "What does `ruby -w` add beyond `-W:deprecated`?" (uninitialized
      ivars, unused vars, method redefinition, etc., via `$VERBOSE = true`).
    tags: [warnings, frozen-string-literal, ruby-3-4]
    source: https://www.ruby-lang.org/en/news/2024/12/25/ruby-3-4-0-released/

  - slug: ruby-tool-bundler-groups-platforms-theory
    kind: theory
    difficulty: junior
    title: "Bundler groups, platforms and `Bundler.require`"
    body: |
      A Gemfile is Ruby code evaluated by Bundler. The main directives:

      ```ruby
      source "https://rubygems.org"
      ruby file: ".ruby-version"

      gem "rails", "~> 7.1.0"
      gem "pg", ">= 1.5"
      gem "bootsnap", require: false
      gem "tzinfo-data", platforms: %i[windows jruby]

      group :development, :test do
        gem "rspec-rails"
        gem "debug"
      end

      group :production do
        gem "newrelic_rpm"
      end
      ```

      - Gems outside any group are in `:default`. Rails calls `Bundler.require(*Rails.groups)`, which
        requires `:default` plus the current environment's group, so `rspec-rails` is never loaded in
        production.
      - Install-time exclusion: `bundle config set --local without production` (persisted in
        `.bundle/config`); CI often uses `without development`. Resolution still includes every group, so
        two groups cannot pin different versions of one gem.
      - `platforms:` restricts a gem to interpreters/OSes (`ruby`, `mri`, `jruby`, `windows`, with
        versions like `ruby_33`). The lock records `PLATFORMS`; `bundle lock --add-platform x86_64-linux`
        lets a lock created on macOS install on Linux (needed for gems with precompiled binaries such as
        nokogiri).
      - Version operators: `"= 1.0"`, `">= 1.0"`, `"~> 1.0"` (pessimistic), combinations
        `">= 1.0", "< 2.0"`. Prefer `~>` for libraries that follow SemVer.
      - Alternative sources: `gem "x", github: "org/x", branch: "main"`, `path: "../x"`, a `source` block
        for a private server, `git:` with `ref:`/`tag:`.
      - Maintenance commands: `bundle outdated` (what could be updated), `bundle audit` (via the
        bundler-audit gem, known CVEs), `bundle show gem` / `bundle open gem` (locate/edit sources),
        `bundle lock --update --conservative`.
    answer: |
      **Q:** You add `gem "pry"` inside `group :development` and `bin/rails console` in production fails
      with "cannot load such file -- pry". Why is that expected?
      **A:** `Bundler.require(*Rails.groups)` only loads `:default` and `:production` in production;
      development-group gems are not required (and typically not installed, if `without development` was
      configured).
    explanation: |
      Interviewers probe whether candidates understand that groups affect loading and installation, not
      resolution. The `bundle lock --add-platform` point comes up with Docker deploys from Apple Silicon.
    tags: [bundler, gemfile]
    source: https://guides.rubygems.org/gemfile/

  - slug: ruby-tool-gem-structure-theory
    kind: theory
    difficulty: junior
    title: "Anatomy of a gem"
    body: |
      ```text
      my_gem/
        my_gem.gemspec        # metadata + dependencies
        Gemfile               # just `source` + `gemspec`
        Rakefile              # require "bundler/gem_tasks" -> rake build / install / release
        lib/
          my_gem.rb           # the only top-level file; requires the rest
          my_gem/
            version.rb        # MyGem::VERSION = "1.2.0"
            client.rb
        exe/                  # executables (spec.bindir = "exe", spec.executables)
        sig/                  # optional RBS signatures
        spec/ or test/
      ```

      ```ruby
      # my_gem.gemspec
      require_relative "lib/my_gem/version"

      Gem::Specification.new do |spec|
        spec.name     = "my_gem"
        spec.version  = MyGem::VERSION
        spec.summary  = "One line"
        spec.authors  = ["Me"]
        spec.license  = "MIT"
        spec.required_ruby_version = ">= 3.1"
        spec.files    = Dir["lib/**/*.rb", "LICENSE.txt", "README.md"]
        spec.add_dependency "zeitwerk", "~> 2.6"
        spec.add_development_dependency "rspec", "~> 3.13"
      end
      ```

      - RubyGems adds `lib/` (`require_paths`) to `$LOAD_PATH` when the gem is activated, which is why
        gem code uses `require "my_gem/client"` and never `require_relative` across the load path.
      - `require "my_gem"` is what `Bundler.require` calls; `lib/my_gem.rb` must exist with that exact
        name (or set `require:` in the Gemfile).
      - `gem build my_gem.gemspec` packages a `.gem` (a tar with metadata + data); `gem push` uploads it;
        `gem install my_gem -v 1.2.0`, `gem list`, `gem contents`, `gem which my_gem` locate files.
      - Autoloading inside gems: either explicit `require`s in `lib/my_gem.rb`, `autoload :Client,
        "my_gem/client"` for laziness, or `Zeitwerk::Loader.for_gem` (Rails-style conventions).
      - YARD: document public API with `# @param name [String]`, `# @return [User, nil]`, `# @example`;
        `yard doc` builds HTML, `yard stats --list-undoc` finds gaps; rubydoc.info renders it for
        published gems.
    answer: |
      **Q:** Why does a gem's own code use `require "my_gem/client"` rather than `require_relative
      "client"`?
      **A:** Both work, but `require` through `$LOAD_PATH` is the convention: it keeps the public
      require names stable regardless of file layout, and matches what consumers and `Bundler.require`
      use.
    explanation: |
      A typical follow-up: "What is the difference between `gem install` and adding to a Gemfile?"
      (global installation vs project-scoped resolution; `bundle exec` only sees Gemfile gems).
    tags: [gems, gemspec, yard]
    source: https://guides.rubygems.org/gemfile/

  - slug: ruby-tool-pattern-matching-overview-theory
    kind: theory
    difficulty: middle
    title: "Pattern matching essentials: `case/in`, guards, pin, `=>`, `in`"
    body: |
      Ruby 2.7 introduced pattern matching; it has been stable since 3.0 and is the idiomatic way to
      destructure JSON-like data.

      ```ruby
      def handle(event)
        case event
        in {type: "order", id: Integer => id, items: [_, *] => items}   # hash + array, binds id/items
          "order #{id} with #{items.size} items"
        in {type: "refund", amount: Numeric => amount} if amount > 0     # guard
          "refund #{amount}"
        in {type: "ping" | "pong"}                                       # alternative
          "noop"
        in {type: ^@expected_type}                                       # pin: compare with a variable
          "expected"
        in [Integer => a, *rest]                                         # array pattern with splat
          "list starting at #{a}"
        in String | Symbol => name                                       # class check + binding
          "named #{name}"
        else
          "unknown"
        end
      end
      ```

      - Without `else`, an unmatched `case/in` raises `NoMatchingPatternError` (unlike `case/when`,
        which returns `nil`).
      - Hash patterns match on a subset of symbol keys; `{}` matches only empty; `**nil` forbids extras;
        `**rest` collects them. Array patterns match the whole array unless a splat is present;
        `[*, x, *]` is a find pattern.
      - Values are matched with `===`, so classes, ranges (`in 1..9`), regexes and lambdas
        (`in ->(x) { x.even? }`) all work; `=> name` binds, `^name` pins, `_` ignores.
      - Rightward assignment `data => {user: {name:}}` destructures or raises; `data in {user: {name:}}`
        returns true/false.
      - `deconstruct` / `deconstruct_keys` make any object matchable; `Struct`, `Data`, `Time`, `Date`,
        `MatchData` already are.
    answer: |
      **Q:** What is the difference between `in {name: name}` and `in {name: ^name}`?
      **A:** The first *binds* whatever is under `:name` to a new local `name` (shadowing any existing
      one); the second *compares* the value with the existing `name` variable using `===`.
    explanation: |
      Interviewers like the `NoMatchingPatternError` detail and the bind-vs-pin confusion; both are
      sources of real bugs when teams first adopt pattern matching.
    tags: [pattern-matching]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-tool-modern-stdlib-additions-theory
    kind: theory
    difficulty: middle
    title: "Small Ruby 3.x additions worth knowing"
    body: |
      A grab bag of methods and syntax added in 2.6-3.4 that show up in modern codebases:

      ```ruby
      x, y = 1, 2
      {x:, y:}                               # 3.1 hash shorthand => {x: 1, y: 2}
      h = {a: 1, b: 2, c: 3}
      h.except(:a)                           # 3.0 (was ActiveSupport) => {b: 2, c: 3}
      h.filter_map { |k, v| k if v.odd? }    # 2.7 => [:a, :c]
      %w[a b a].tally                        # 2.7 => {"a"=>2, "b"=>1}
      [1, 2].intersect?([2, 3])              # 3.1 => true
      [1, 2, 3].sum                          # 2.4, exact for Integers/Rationals
      7.ceildiv(2)                           # 3.2 => 4 (pages = total.ceildiv(per_page))
      15.clamp(0, 10)                        # 2.4; 2.7+ accepts a range: 15.clamp(..10)
      5.then { |n| n + 1 }                   # 2.6 yield_self alias, for pipelines
      Set[1, 2]                              # 3.2: no `require "set"` needed (autoloaded)
      "abc".bytesplice(0, 1, "z")            # 3.2
      Integer.try_convert("1")               # 3.1
      Time.now.deconstruct_keys(nil)         # 3.2 => {year:, month:, ...} for pattern matching
      ```

      - `Object#in?` (`x.in?(list)`) is ActiveSupport, not core; core has `Array#include?` and
        `Comparable#clamp`/`between?`. Likewise `Hash#except` only became core in 3.0.
      - `Struct.new(:a, keyword_init: true)` is still valid but since 3.2 a Struct accepts keyword
        arguments without it (`Point.new(x: 1, y: 2)`); passing `keyword_init: false` restricts to
        positional.
      - `Hash#inspect` output changed in 3.4: `{name: "A", "k" => 1}` instead of `{:name=>"A", "k"=>1}`,
        which breaks tests asserting on inspected hashes.
      - `ObjectSpace::WeakKeyMap` (3.3) is a map with weakly referenced keys, for caches keyed by
        objects that should not be kept alive; `ObjectSpace::WeakMap` has weak keys and values.
      - `Enumerable#sum` uses Kahan-Babuska summation for Floats, so it is more accurate than
        `inject(:+)`.
    answer: |
      **Q:** `Set` works without `require "set"` since which version, and `Hash#except` is core since
      which version?
      **A:** `Set` since 3.2 (autoloaded on first use of the constant or `to_set`); `Hash#except` since
      3.0 (earlier it came from ActiveSupport).
    explanation: |
      Interviewers use these to check whether a candidate keeps up with the language; the ActiveSupport
      vs core distinction (`in?`, `except`, `blank?`) catches people who only know Rails.
    tags: [ruby-3, stdlib]
    source: https://www.ruby-lang.org/en/news/2022/12/25/ruby-3-2-0-released/

  - slug: ruby-tool-struct-vs-data-theory
    kind: theory
    difficulty: junior
    title: "`Struct` vs `Data.define`"
    body: |
      ```ruby
      Point  = Struct.new(:x, :y)             # mutable, positional or keyword init since 3.2
      Coord  = Data.define(:lat, :lng) do     # immutable value object (3.2)
        def to_s = "#{lat},#{lng}"
      end

      pt = Point.new(1, 2); pt.x = 5          # ok
      pt.to_a                                 # [5, 2]; Struct is Enumerable
      Point.new(1)                            # y => nil

      c = Coord.new(lat: 1.0, lng: 2.0)
      c.lat = 3.0                             # NoMethodError
      c.frozen?                               # true
      c.with(lng: 9.0)                        # new Coord
      Coord.new(1.0)                          # ArgumentError: missing keyword :lng
      c == Coord.new(1.0, 2.0)                # true (value equality, also eql?/hash)
      ```

      - Use `Struct` when you need a quick mutable record or `to_a`/`each`/`[]` access; use `Data` for
        values that should never change (money, coordinates, config, events), which also makes them safe
        as hash keys and shareable across Ractors once frozen.
      - Both support pattern matching (`in {lat:, lng:}`, `in [lat, lng]`).
      - Validation/defaults for `Data`: override `initialize(lat:, lng: 0.0)` and call `super(lat:
        Float(lat), lng:)`; `Data` always passes keyword arguments to `initialize`, even for positional
        `new(1, 2)`.
      - `Struct.new("Name")` (string first arg) defines `Struct::Name`; avoid. `keyword_init: true` is
        legacy since 3.2 but still changes `inspect` and forbids positional args.
      - OpenStruct is slower, dynamic and discouraged (security and performance); prefer `Struct`,
        `Data`, or a plain class.
    answer: |
      **Q:** Why does `Data` deliberately raise on a missing member instead of defaulting to `nil` like
      `Struct`?
      **A:** It is a value object: all members are part of its identity, so a partially built value
      is a bug; defaults must be explicit via a custom `initialize`.
    explanation: |
      Follow-up: "How would you add a default to a `Data` member?" (override `initialize` with keyword
      default, then `super`). Also "Is a `Data` instance deeply frozen?" (no, only the instance).
    tags: [struct, data, ruby-3-2]
    source: https://docs.ruby-lang.org/en/3.3/Data.html

  - slug: ruby-tool-bundler-inline-rakefile-theory
    kind: theory
    difficulty: middle
    title: "`bundler/inline`, Rakefile conventions and `rake db:` tasks"
    body: |
      **Single-file scripts with dependencies** use `bundler/inline` to avoid a Gemfile:

      ```ruby
      require "bundler/inline"

      gemfile do
        source "https://rubygems.org"
        gem "httparty", "~> 0.21"
        gem "benchmark-ips"
      end

      puts HTTParty.get("https://example.com").code
      ```

      `gemfile(true)` installs missing gems on the fly; this is the standard way to write reproducible
      bug reports (Rails' bug report templates use it) and one-off scripts.

      **Rakefile conventions:**

      ```ruby
      require "bundler/gem_tasks"      # build, install, release (gems)
      require "rspec/core/rake_task"
      RSpec::Core::RakeTask.new(:spec)
      require "rubocop/rake_task"
      RuboCop::RakeTask.new

      task default: %i[spec rubocop]   # what bare `rake` runs; CI typically runs the same
      ```

      - `rake -T` lists described tasks, `rake -P` dependencies, `rake -t` traces.
      - A Rails app's `Rakefile` just loads `config/application.rb` and calls `Rails.application.load_tasks`,
        which picks up `lib/tasks/*.rake` and the engine/gem tasks.

      **`rake db:` family** (also `bin/rails db:*`): `db:create`, `db:migrate` (runs pending migrations
      and dumps `db/schema.rb`), `db:rollback STEP=2`, `db:migrate:status`, `db:schema:load` (fresh DB
      from schema, faster than replaying migrations), `db:seed`, `db:setup` (create + schema:load + seed),
      `db:prepare` (create and migrate or load schema if the DB is missing, seeds on first run; the
      recommended deploy/CI command), `db:reset` (drop + setup), `db:migrate:redo`. Multiple databases
      get namespaced tasks (`db:migrate:primary`). `RAILS_ENV=test` selects the environment.
    answer: |
      **Q:** Why would you run `db:prepare` instead of `db:migrate` in a deploy script?
      **A:** `db:prepare` handles both cases: an existing database gets pending migrations, a missing
      one is created and loaded from the schema (and seeded), so one command works for fresh and existing
      environments.
    explanation: |
      Follow-up: "Why is `db:schema:load` preferred over replaying all migrations on a new machine?"
      (old migrations reference models/columns that no longer exist and are slow; the schema is the
      source of truth once migrations are merged).
    tags: [bundler, rake, rails]
    source: https://bundler.io/man/gemfile.5.html

  - slug: ruby-tool-introspection-and-dev-tools-theory
    kind: theory
    difficulty: senior
    title: "Interpreter flags, `ObjectSpace` and `ruby-lsp`"
    body: |
      Command-line knobs worth knowing in interviews and incident response:

      ```bash
      ruby -c app.rb                 # syntax check only
      ruby -w app.rb                 # all warnings ($VERBOSE = true)
      ruby -W:no-deprecated app.rb   # silence one category; -W:deprecated enables it
      ruby -W0 app.rb                # no warnings at all (also silences Kernel#warn)
      ruby --yjit -e '...'           # enable YJIT; RUBYOPT=--yjit applies everywhere
      ruby -I lib -r my_gem -e '...' # add load path, pre-require a file
      ruby --dump=insns app.rb       # YARV bytecode; --dump=parsetree / --dump=prism_parsetree
      RUBY_DEBUG_OPEN=1 bin/rails s  # debug gem: open a remote debugging port
      RUBY_GC_HEAP_INIT_SLOTS=...    # GC tuning env vars
      ```

      `RUBYOPT` holds extra flags applied to every `ruby` process (including those started by
      shims, Bundler and Rails); `RUBYLIB` adds to `$LOAD_PATH`.

      **`ObjectSpace`** gives a window into the heap:

      ```ruby
      ObjectSpace.count_objects            # {TOTAL:, FREE:, T_STRING:, T_ARRAY:, ...}
      ObjectSpace.each_object(Class).count
      ObjectSpace.memsize_of(obj)          # require "objspace"
      ObjectSpace.trace_object_allocations { ... }   # where was an object allocated?
      ObjectSpace.dump_all(output: File.open("heap.json", "w"))  # for heap diffing tools
      ObjectSpace::WeakMap.new / WeakKeyMap.new (3.3)
      GC.stat, GC.compact, GC.config (3.4)
      ```

      `each_object` is slow and disables some optimisations; it is a diagnostic tool (leak hunting with
      heap dumps, `derailed_benchmarks`, `memory_profiler`), never application logic.

      **`ruby-lsp`** (Shopify) is the standard Language Server: diagnostics, hover docs, go-to-definition,
      completion, formatting via RuboCop/Syntax Tree, test running and debugging through the `debug`
      gem, with add-ons for Rails and RBS/Sorbet. It is built on Prism and is what the VS Code Ruby
      extension uses; Sorbet and Steep ship their own LSPs that can run alongside.
    answer: |
      **Q:** You suspect a memory leak in a Puma worker. Which two `ObjectSpace`-based steps would you
      take?
      **A:** Enable `ObjectSpace.trace_object_allocations_start` (or `memory_profiler`) around the
      suspicious work, then take `ObjectSpace.dump_all` heap dumps at intervals and diff them (e.g. with
      `heapy`/`harb`) to find which object types and allocation sites keep growing.
    explanation: |
      Interviewers use this to see whether a candidate has debugged production Ruby, not just written it.
      Knowing that `-W0` silences `warn` is a frequent "why does my test not see the warning" puzzle.
    tags: [cli, objectspace, ruby-lsp]
    source: https://github.com/ruby/debug

  - slug: ruby-tool-code-pattern-matching-event-parser
    kind: code
    difficulty: senior
    title: "Parse webhook events with pattern matching"
    body: |
      Implement `describe_event(event)` using `case/in` pattern matching (no `if`/`dig` chains). `event`
      is a Hash with symbol keys. Rules, in priority order:

      1. `{type: "order.created", data: {id: Integer, items: [...]}}` with a non-empty `items` array:
         return `"order <id>: <n> items"`.
      2. `{type: "order.created"}` with an empty `items` array: return `"order <id>: empty"`.
      3. `{type: "refund", data: {amount: Numeric}}` where amount > 0: return `"refund <amount>"`;
         if amount is not positive: `"invalid refund"`.
      4. `{type: "user.renamed", data: {from: String, to: String}}`: return `"<from> -> <to>"`.
      5. Anything else (including unknown type, missing keys, wrong types): return `"unknown"`.

      ```ruby
      describe_event({type: "order.created", data: {id: 7, items: [1, 2]}})  # => "order 7: 2 items"
      describe_event({type: "refund", data: {amount: 0}})                    # => "invalid refund"
      describe_event({type: "order.created", data: {id: "7", items: []}})    # => "unknown"
      ```
    starter_code: |
      def describe_event(event)
        case event
        # in ... then ...
        end
      end
    tests: |
      require "minitest/autorun"

      class DescribeEventTest < Minitest::Test
        def test_order_with_items
          assert_equal "order 7: 2 items", describe_event({type: "order.created", data: {id: 7, items: [1, 2]}})
        end

        def test_empty_order
          assert_equal "order 9: empty", describe_event({type: "order.created", data: {id: 9, items: []}})
        end

        def test_refund_positive_and_non_positive
          assert_equal "refund 12.5", describe_event({type: "refund", data: {amount: 12.5}})
          assert_equal "invalid refund", describe_event({type: "refund", data: {amount: 0}})
          assert_equal "invalid refund", describe_event({type: "refund", data: {amount: -3}})
        end

        def test_rename
          assert_equal "ann -> anna", describe_event({type: "user.renamed", data: {from: "ann", to: "anna"}})
        end

        def test_unknown_shapes
          assert_equal "unknown", describe_event({type: "order.created", data: {id: "7", items: []}})
          assert_equal "unknown", describe_event({type: "order.created", data: {id: 1}})
          assert_equal "unknown", describe_event({type: "refund", data: {amount: "10"}})
          assert_equal "unknown", describe_event({type: "user.renamed", data: {from: "a"}})
          assert_equal "unknown", describe_event({type: "login"})
          assert_equal "unknown", describe_event({})
        end

        def test_extra_keys_are_tolerated
          assert_equal "order 1: 1 items", describe_event({type: "order.created", data: {id: 1, items: [:x], note: "hi"}, meta: 1})
        end
      end
    solution: |
      def describe_event(event)
        case event
        in {type: "order.created", data: {id: Integer => id, items: [_, *] => items}}
          "order #{id}: #{items.size} items"
        in {type: "order.created", data: {id: Integer => id, items: []}}
          "order #{id}: empty"
        in {type: "refund", data: {amount: Numeric => amount}} if amount > 0
          "refund #{amount}"
        in {type: "refund", data: {amount: Numeric}}
          "invalid refund"
        in {type: "user.renamed", data: {from: String => from, to: String => to}}
          "#{from} -> #{to}"
        else
          "unknown"
        end
      end
    explanation: |
      Hash patterns match a subset of keys (extra keys are fine), nested patterns check types with
      `===`, `=> name` binds, `[_, *]` means "at least one element", and a guard (`if amount > 0`)
      handles conditions that patterns cannot express. Clause order matters: the guarded refund clause
      must come before the catch-all refund clause. The `else` branch prevents `NoMatchingPatternError`.
      Compare with the `dig`/`is_a?` version to see why interviewers like this feature.
    tags: [code, pattern-matching]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html

  - slug: ruby-tool-code-data-define-money
    kind: code
    difficulty: junior
    title: "A validated `Money` value object with `Data.define`"
    body: |
      Define `Money = Data.define(:amount, :currency)` such that:

      - `Money.new(amount: 100, currency: "eur")` stores `currency` upcased (`"EUR"`), and positional
        construction `Money.new(100, "eur")` works the same.
      - `amount` must be an `Integer` >= 0 (cents), otherwise `ArgumentError` is raised.
      - `money + other` returns a new `Money` when currencies match, raises `ArgumentError` otherwise.
      - `to_s` returns `"1.00 EUR"` style formatting (two decimals).

      Instances must stay immutable and support `with` and value equality.

      ```ruby
      m = Money.new(150, "usd")
      m.currency        # => "USD"
      (m + Money.new(50, "USD")).to_s   # => "2.00 USD"
      ```
    starter_code: |
      Money = Data.define(:amount, :currency) do
        # your code here
      end
    tests: |
      require "minitest/autorun"

      class MoneyTest < Minitest::Test
        def test_normalises_currency_for_keyword_and_positional
          assert_equal "EUR", Money.new(amount: 100, currency: "eur").currency
          assert_equal "EUR", Money.new(100, "eur").currency
        end

        def test_validates_amount
          assert_raises(ArgumentError) { Money.new(-1, "EUR") }
          assert_raises(ArgumentError) { Money.new(1.5, "EUR") }
          assert_raises(ArgumentError) { Money.new("1", "EUR") }
        end

        def test_addition_and_formatting
          sum = Money.new(150, "usd") + Money.new(50, "USD")
          assert_equal Money.new(200, "USD"), sum
          assert_equal "2.00 USD", sum.to_s
          assert_equal "0.05 EUR", Money.new(5, "eur").to_s
        end

        def test_currency_mismatch
          assert_raises(ArgumentError) { Money.new(1, "USD") + Money.new(1, "EUR") }
        end

        def test_immutable_and_with
          m = Money.new(1, "EUR")
          assert m.frozen?
          refute m.respond_to?(:amount=)
          assert_equal Money.new(9, "EUR"), m.with(amount: 9)
          assert_equal m.hash, Money.new(1, "eur").hash
        end
      end
    solution: |
      Money = Data.define(:amount, :currency) do
        def initialize(amount:, currency:)
          raise ArgumentError, "amount must be a non-negative Integer" unless amount.is_a?(Integer) && amount >= 0

          super(amount: amount, currency: currency.to_s.upcase)
        end

        def +(other)
          raise ArgumentError, "currency mismatch" unless currency == other.currency

          with(amount: amount + other.amount)
        end

        def to_s
          format("%d.%02d %s", amount / 100, amount % 100, currency)
        end
      end
    explanation: |
      `Data` always calls `initialize` with keyword arguments, even for positional `new(100, "eur")`, so one
      override handles both forms: validate, normalise, then `super(**)`. Instances are frozen after
      `initialize`, which is why normalisation must happen before `super` rather than by mutating
      afterwards. `with` reuses the same `initialize`, so validation also applies to copies. Equality and
      `hash` come for free from the members, making `Money` usable as a Hash key.
    tags: [code, data, value-object]
    source: https://docs.ruby-lang.org/en/3.3/Data.html

  - slug: ruby-tool-code-gem-version-requirements
    kind: code
    difficulty: senior
    title: "Resolve the best version for a requirement"
    body: |
      Using only `Gem::Version` / `Gem::Requirement` from the standard library, implement:

      - `satisfies?(version, requirement)`: `version` is a String like `"2.1.4"`, `requirement` a String
        with one or more comma-separated constraints like `"~> 2.1"` or `">= 1.0, < 3"`. Returns true/false.
      - `best_match(versions, requirement)`: given an Array of version Strings, return the highest
        version String that satisfies the requirement, ignoring prerelease versions (such as `"3.0.0.rc1"`)
        unless the requirement itself mentions a prerelease. Return `nil` if nothing matches.

      ```ruby
      satisfies?("2.1.4", "~> 2.1")                         # => true
      satisfies?("3.0.0", "~> 2.1")                         # => false
      best_match(%w[2.0.0 2.1.4 2.10.0 3.0.0.rc1], "~> 2.1") # => "2.10.0"
      ```
    starter_code: |
      def satisfies?(version, requirement)
        # your code here
      end

      def best_match(versions, requirement)
        # your code here
      end
    tests: |
      require "minitest/autorun"

      class VersionRequirementTest < Minitest::Test
        def test_satisfies_pessimistic_and_compound
          assert satisfies?("2.1.4", "~> 2.1")
          assert satisfies?("2.9.0", "~> 2.1")
          refute satisfies?("3.0.0", "~> 2.1")
          assert satisfies?("2.1.9", "~> 2.1.4")
          refute satisfies?("2.2.0", "~> 2.1.4")
          assert satisfies?("2.5", ">= 1.0, < 3")
          refute satisfies?("3.0", ">= 1.0, < 3")
        end

        def test_best_match_prefers_numeric_order_not_string_order
          assert_equal "2.10.0", best_match(%w[2.0.0 2.1.4 2.10.0 2.9.9], "~> 2.1")
        end

        def test_best_match_ignores_prereleases_by_default
          assert_equal "2.1.4", best_match(%w[2.1.4 3.0.0.rc1], ">= 2.0")
          assert_equal "3.0.0.rc1", best_match(%w[2.1.4 3.0.0.rc1], ">= 3.0.0.rc1")
        end

        def test_best_match_returns_nil_when_nothing_fits
          assert_nil best_match(%w[1.0.0 1.2.0], "~> 2.0")
          assert_nil best_match([], "~> 2.0")
        end
      end
    solution: |
      def satisfies?(version, requirement)
        Gem::Requirement.new(*requirement.split(",").map(&:strip)).satisfied_by?(Gem::Version.new(version))
      end

      def best_match(versions, requirement)
        req = Gem::Requirement.new(*requirement.split(",").map(&:strip))
        candidates = versions.map { |v| Gem::Version.new(v) }
        candidates = candidates.reject(&:prerelease?) unless req.prerelease?
        candidates.select { |v| req.satisfied_by?(v) }.max&.to_s
      end
    explanation: |
      This is what Bundler's resolver does at its core (plus dependency graphs and conflict resolution).
      `Gem::Version` compares segment-wise numerically, so `2.10.0 > 2.9.9`, and treats any segment with
      letters as a prerelease that sorts before the corresponding release. RubyGems and Bundler ignore
      prereleases unless a constraint explicitly includes one, which is exactly the `req.prerelease?`
      check here. `Gem::Requirement` accepts several constraints and `&.` handles the empty case.
    tags: [code, rubygems, versions]
    source: https://docs.ruby-lang.org/en/3.3/Gem/Version.html

  - slug: ruby-tool-code-argument-forwarding-counter
    kind: code
    difficulty: junior
    title: "A call-counting proxy with `(...)` forwarding"
    body: |
      Implement `CallCounter`, a proxy that forwards method calls to a wrapped object and counts them:

      - `CallCounter.new(target)`
      - `counter.call(name, ...)` forwards all positional arguments, keyword arguments and the block to
        `target.public_send(name, ...)` and returns its result. Use argument forwarding (`...` or the
        anonymous `*`, `**`, `&` forms), not `*args, **kwargs, &block` by name.
      - `counter.counts` returns a Hash `{method_name => times_called}`.

      ```ruby
      c = CallCounter.new([3, 1, 2])
      c.call(:sort)                      # => [1, 2, 3]
      c.call(:each_slice, 2).to_a        # => [[3, 1], [2]]
      c.call(:map) { |x| x * 2 }         # => [6, 2, 4]
      c.counts                           # => {sort: 1, each_slice: 1, map: 1}
      ```
    starter_code: |
      class CallCounter
        def initialize(target)
          # your code here
        end

        def call(name, ...)
          # your code here
        end

        def counts
        end
      end
    tests: |
      require "minitest/autorun"

      class Greeter
        def greet(name, punctuation: "!") = "hi #{name}#{punctuation}"
      end

      class CallCounterTest < Minitest::Test
        def test_forwards_positional_and_keyword_args
          c = CallCounter.new(Greeter.new)
          assert_equal "hi ann!", c.call(:greet, "ann")
          assert_equal "hi bob?", c.call(:greet, "bob", punctuation: "?")
          assert_equal({ greet: 2 }, c.counts)
        end

        def test_forwards_blocks
          c = CallCounter.new([3, 1, 2])
          assert_equal [6, 2, 4], c.call(:map) { |x| x * 2 }
          assert_equal [[3, 1], [2]], c.call(:each_slice, 2).to_a
          assert_equal({ map: 1, each_slice: 1 }, c.counts)
        end

        def test_counts_start_empty
          assert_equal({}, CallCounter.new(nil).counts)
        end
      end
    solution: |
      class CallCounter
        def initialize(target)
          @target = target
          @counts = Hash.new(0)
        end

        def call(name, ...)
          @counts[name] += 1
          @target.public_send(name, ...)
        end

        def counts
          @counts.reject { |_, v| v.zero? }
        end
      end
    explanation: |
      `...` (Ruby 2.7+, leading arguments allowed since 3.0) forwards positionals, keywords and the block
      in one token and avoids the classic 2.x delegation bug where a trailing hash was silently
      converted to keywords (or not). The anonymous forms `def call(name, *, **, &) = @target.public_send(
      name, *, **, &)` (3.2+) are equivalent and let you forward selectively. `Hash.new(0)` makes counting a
      one-liner; `counts` returns a plain copy so callers cannot mutate the internal tally (note that a
      `Hash.new(0)` compared with `{}` is equal, so the `reject` is only there to return a fresh Hash).
    tags: [code, arguments, forwarding]
    source: https://docs.ruby-lang.org/en/3.3/syntax/methods_rdoc.html

  - slug: ruby-tool-code-paginator-clamp-ceildiv
    kind: code
    difficulty: junior
    title: "Paginator with `ceildiv` and `clamp`"
    body: |
      Implement `Paginator.new(total:, per_page:)` with:

      - `total_pages`: number of pages needed (`Integer#ceildiv`, Ruby 3.2); at least 1 even when
        `total` is 0.
      - `page(n)`: clamps `n` into `1..total_pages` (`Comparable#clamp`) and returns a Hash
        `{page:, offset:, limit:}` where `offset` is the number of records to skip and `limit` is the number
        of records on that page (the last page may be shorter).

      ```ruby
      pg = Paginator.new(total: 23, per_page: 10)
      pg.total_pages   # => 3
      pg.page(2)       # => {page: 2, offset: 10, limit: 10}
      pg.page(3)       # => {page: 3, offset: 20, limit: 3}
      pg.page(99)      # => {page: 3, offset: 20, limit: 3}
      pg.page(-4)      # => {page: 1, offset: 0, limit: 10}
      ```
    starter_code: |
      class Paginator
        def initialize(total:, per_page:)
          # your code here
        end

        def total_pages
        end

        def page(n)
        end
      end
    tests: |
      require "minitest/autorun"

      class PaginatorTest < Minitest::Test
        def test_total_pages_rounds_up
          assert_equal 3, Paginator.new(total: 23, per_page: 10).total_pages
          assert_equal 2, Paginator.new(total: 20, per_page: 10).total_pages
          assert_equal 1, Paginator.new(total: 0, per_page: 10).total_pages
        end

        def test_page_offsets_and_limits
          pg = Paginator.new(total: 23, per_page: 10)
          assert_equal({ page: 1, offset: 0, limit: 10 }, pg.page(1))
          assert_equal({ page: 2, offset: 10, limit: 10 }, pg.page(2))
          assert_equal({ page: 3, offset: 20, limit: 3 }, pg.page(3))
        end

        def test_page_is_clamped
          pg = Paginator.new(total: 23, per_page: 10)
          assert_equal({ page: 3, offset: 20, limit: 3 }, pg.page(99))
          assert_equal({ page: 1, offset: 0, limit: 10 }, pg.page(-4))
          assert_equal({ page: 1, offset: 0, limit: 0 }, Paginator.new(total: 0, per_page: 5).page(7))
        end
      end
    solution: |
      class Paginator
        def initialize(total:, per_page:)
          @total = total
          @per_page = per_page
        end

        def total_pages
          [@total.ceildiv(@per_page), 1].max
        end

        def page(n)
          page = n.clamp(1, total_pages)
          offset = (page - 1) * @per_page
          { page: page, offset: offset, limit: (@total - offset).clamp(0, @per_page) }
        end
      end
    explanation: |
      `Integer#ceildiv` (3.2) replaces the `(total + per_page - 1) / per_page` or `(total / per_page.to_f).ceil`
      idioms. `Comparable#clamp(min, max)` (2.4; a Range form `clamp(1..)` since 2.7) replaces
      `[[n, 1].max, total_pages].min`. The `limit` computation uses `Array#max(0)` only to keep the
      expression total-safe; a plain `[0, [@per_page, @total - offset].min].max` reads the same.
      Interviewers use pagination because it is full of off-by-one edges: zero records, exact multiples,
      and out-of-range pages.
    tags: [code, ceildiv, clamp]
    source: https://www.ruby-lang.org/en/news/2022/12/25/ruby-3-2-0-released/

  - slug: ruby-tool-code-deconstruct-keys-point
    kind: code
    difficulty: senior
    title: "Make a class pattern-matchable with `deconstruct` and `deconstruct_keys`"
    body: |
      Implement `class Point` with `initialize(x, y)` and readers so that:

      - `case point in [x, y]` works via `deconstruct`, returning `[x, y]`.
      - `case point in {x:, y:, quadrant:}` works via `deconstruct_keys(keys)`. The `quadrant` key
        is computed (`1..4` by sign of x/y, `0` if on an axis) and must only be computed when requested:
        when `keys` is an Array that does not include `:quadrant`, the returned Hash must not contain it.
        When `keys` is `nil` (pattern uses `**rest`), return all three keys.
      - `Point.origin?(obj)` returns true if `obj` pattern-matches `Point(x: 0, y: 0)`.

      ```ruby
      pt = Point.new(3, -4)
      case pt
      in {x:, quadrant: 4} then "x=#{x} in Q4"
      end
      pt.deconstruct_keys([:x])   # => {x: 3}
      ```
    starter_code: |
      class Point
        attr_reader :x, :y

        def initialize(x, y)
          @x, @y = x, y
        end

        def deconstruct
          # your code here
        end

        def deconstruct_keys(keys)
          # your code here
        end

        def self.origin?(obj)
          # your code here
        end
      end
    tests: |
      require "minitest/autorun"

      class PointPatternTest < Minitest::Test
        def test_array_pattern
          result = case Point.new(1, 2)
                   in [a, b] then a + b
                   end
          assert_equal 3, result
        end

        def test_hash_pattern_with_computed_quadrant
          result = case Point.new(3, -4)
                   in {x:, quadrant: 4} then "x=#{x} in Q4"
                   in {quadrant:} then "Q#{quadrant}"
                   end
          assert_equal "x=3 in Q4", result
          assert_equal 2, ((Point.new(-1, 5) in {quadrant: 2}) ? 2 : 0)
          assert_equal 0, Point.new(0, 5).deconstruct_keys([:quadrant])[:quadrant]
        end

        def test_only_requested_keys_are_returned
          assert_equal({ x: 3 }, Point.new(3, 4).deconstruct_keys([:x]))
          assert_equal({ x: 3, y: 4 }, Point.new(3, 4).deconstruct_keys(%i[x y]))
          assert_equal %i[x y quadrant].sort, Point.new(3, 4).deconstruct_keys(nil).keys.sort
        end

        def test_class_pattern_and_origin
          assert Point.origin?(Point.new(0, 0))
          refute Point.origin?(Point.new(0, 1))
          refute Point.origin?({ x: 0, y: 0 })
          matched = case Point.new(0, 0)
                    in Point(x: 0, y: 0) then true
                    end
          assert matched
        end
      end
    solution: |
      class Point
        attr_reader :x, :y

        def initialize(x, y)
          @x, @y = x, y
        end

        def deconstruct
          [x, y]
        end

        def deconstruct_keys(keys)
          result = { x: x, y: y }
          result[:quadrant] = quadrant if keys.nil? || keys.include?(:quadrant)
          keys ? result.slice(*keys) : result
        end

        def self.origin?(obj)
          obj in Point(x: 0, y: 0)
        end

        private

        def quadrant
          return 0 if x.zero? || y.zero?

          if x.positive?
            y.positive? ? 1 : 4
          else
            y.positive? ? 2 : 3
          end
        end
      end
    explanation: |
      `deconstruct` powers array and find patterns; `deconstruct_keys(keys)` powers hash patterns and
      receives the keys the pattern asked for (or `nil` with `**rest`) so expensive values are computed
      only on demand, which is the design rationale interviewers want to hear. `Point(x: 0, y: 0)` first
      checks `Point === obj` and then calls `deconstruct_keys([:x, :y])`, so a plain Hash does not match.
      `obj in pattern` returns a boolean, handy for predicates. `Struct` and `Data` provide both methods
      automatically.
    tags: [code, pattern-matching, deconstruct]
    source: https://docs.ruby-lang.org/en/3.3/syntax/pattern_matching_rdoc.html
